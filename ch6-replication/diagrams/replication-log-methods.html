<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three replication-log implementations — concept sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f7f2e8;font-family:'Nunito','Vazirmatn',system-ui,sans-serif}
  .wrap{max-width:1240px;margin:0 auto;padding:16px}
</style>
</head>
<body>
<div class="wrap">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Taxonomy of statement-based, WAL shipping and logical replication logs">
<title>Three replication-log implementations</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#302828"/>
</marker>
</defs>
<rect x="0" y="0" width="1240" height="660" rx="24" fill="#f7f2e8"/>
<text x="620" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#302828">Three replication-log implementations</text>

<!-- headers -->
<rect x="60" y="88" width="340" height="60" rx="16" fill="#ffcfb8" stroke="#302828" stroke-width="2"/>
<text x="230" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Statement-based</text>
<rect x="450" y="88" width="340" height="60" rx="16" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<text x="620" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">WAL shipping</text>
<rect x="840" y="88" width="340" height="60" rx="16" fill="#bfe6c9" stroke="#302828" stroke-width="2"/>
<text x="1010" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Logical (row-based)</text>

<text x="60" y="172" font-size="13" font-weight="800" fill="#302828">IDEA — WHAT SHIPS</text>
<!-- idea boxes -->
<rect x="60" y="184" width="340" height="116" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="230" y="220" text-anchor="middle" font-size="14" fill="#302828">ships the SQL text</text>
<text x="230" y="248" text-anchor="middle" font-size="14" fill="#302828">follower re-executes</text>
<text x="230" y="276" text-anchor="middle" font-size="14" fill="#302828">INSERT / UPDATE / DELETE</text>
<rect x="450" y="184" width="340" height="116" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="620" y="220" text-anchor="middle" font-size="14" fill="#302828">ships physical bytes</text>
<text x="620" y="248" text-anchor="middle" font-size="14" fill="#302828">same block changes</text>
<text x="620" y="276" text-anchor="middle" font-size="14" fill="#302828">engine to engine</text>
<rect x="840" y="184" width="340" height="116" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="1010" y="220" text-anchor="middle" font-size="14" fill="#302828">row-level records</text>
<text x="1010" y="248" text-anchor="middle" font-size="14" fill="#302828">new row / key / delta</text>
<text x="1010" y="276" text-anchor="middle" font-size="14" fill="#302828">decoupled from engine</text>

<text x="60" y="326" font-size="13" font-weight="800" fill="#302828">WEAKNESS</text>
<!-- weakness boxes -->
<rect x="60" y="338" width="340" height="116" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="230" y="374" text-anchor="middle" font-size="14" fill="#302828">NOW() + RAND() differ</text>
<text x="230" y="402" text-anchor="middle" font-size="14" fill="#302828">order + side effects</text>
<text x="230" y="430" text-anchor="middle" font-size="14" fill="#302828">may diverge silently</text>
<rect x="450" y="338" width="340" height="116" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="620" y="374" text-anchor="middle" font-size="14" fill="#302828">tied to one engine</text>
<text x="620" y="402" text-anchor="middle" font-size="14" fill="#302828">no mixed versions</text>
<text x="620" y="430" text-anchor="middle" font-size="14" fill="#302828">no rolling upgrade</text>
<rect x="840" y="338" width="340" height="116" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="1010" y="374" text-anchor="middle" font-size="14" fill="#302828">needs row identity</text>
<text x="1010" y="402" text-anchor="middle" font-size="14" fill="#302828">engine must decode it</text>
<text x="1010" y="430" text-anchor="middle" font-size="14" fill="#302828">heavier than WAL</text>

<text x="60" y="480" font-size="13" font-weight="800" fill="#302828">UPGRADES</text>
<!-- upgrade chips -->
<rect x="60" y="492" width="340" height="56" rx="16" fill="#ffc2da" stroke="#302828" stroke-width="2"/>
<text x="230" y="527" text-anchor="middle" font-size="14" font-weight="800" fill="#302828">risk: nondeterminism</text>
<rect x="450" y="492" width="340" height="56" rx="16" fill="#ffc2da" stroke="#302828" stroke-width="2"/>
<text x="620" y="527" text-anchor="middle" font-size="14" font-weight="800" fill="#302828">blocks rolling upgrades</text>
<rect x="840" y="492" width="340" height="56" rx="16" fill="#bfe6c9" stroke="#302828" stroke-width="2"/>
<text x="1010" y="527" text-anchor="middle" font-size="14" font-weight="800" fill="#302828">rolling upgrades OK</text>

<text x="620" y="606" text-anchor="middle" font-size="14" font-weight="700" fill="#302828">prefer logical: version-proof + feeds CDC pipelines</text>
</svg>
</div>
</body>
</html>
