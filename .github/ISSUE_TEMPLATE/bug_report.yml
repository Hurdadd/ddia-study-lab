name: Bug report
description: Report a reproducible website or content issue
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, page URL, language, theme, browser and viewport
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and screenshots (no secrets or personal data)
