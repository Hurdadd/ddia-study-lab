<g>

<text x="995" y="140" font-size="16" font-weight="800" text-anchor="middle">WITH dedup table + commit-then-ACK</text>
</g>
<g>
<rect x="30" y="164" width="330" height="50" rx="12" fill="#fffdf7"/>

<text x="995" y="194" font-size="15" font-weight="800" text-anchor="middle">APPLIES ONCE on redelivery</text>
</g>
<g>

<rect x="370" y="220" width="400" height="50" rx="12" fill="#ffcfb8"/>
<text x="570" y="250" font-size="15" font-weight="800" text-anchor="middle">APPLIES TWICE</text>
<rect x="780" y="220" width="430" height="50" rx="12" fill="#bfe6c9"/>
<text x="995" y="250" font-size="15" font-weight="800" text-anchor="middle">DEDUP HIT, safe ACK</text>
</g>
<g>
<rect x="30" y="276" width="330" height="50" rx="12" fill="#fffdf7"/>

<rect x="370" y="276" width="400" height="50" rx="12" fill="#ffcfb8"/>

<rect x="780" y="276" width="430" height="50" rx="12" fill="#bfe6c9"/>
<text x="995" y="306" font-size="15" font-weight="800" text-anchor="middle">KEY STILL LIVE, dedup hit</text>
</g>
<g>
<rect x="30" y="332" width="330" height="50" rx="12" fill="#fffdf7"/>
<text x="52" y="362" font-size="15" font-weight="800">same key, new payload</text>
<rect x="370" y="332" width="400" height="50" rx="12" fill="#ffcfb8"/>

<rect x="780" y="388" width="430" height="50" rx="12" fill="#ffcfb8"/>
<text x="995" y="418" font-size="15" font-weight="800" text-anchor="middle">RE-APPLIES: promise ended</text>
</g>
<g>
<rect x="30" y="444" width="330" height="50" rx="12" fill="#fffdf7"/>
<text x="52" y="474" font-size="15" font-weight="800">mail send + crash 2</text>
<rect x="370" y="444" width="400" height="50" rx="12" fill="#ffcfb8"/>
<text x="570" y="474" font-size="15" font-weight="800" text-anchor="middle">SENT TWICE</text>

<g>
<rect x="30" y="508" width="280" height="62" rx="12" fill="#d7e5f5"/>

<rect x="320" y="508" width="280" height="62" rx="12" fill="#d7e5f5"/>
<text x="342" y="532" font-size="14" font-weight="800">TXN: key + effect atomic</text>
<text x="342" y="554" font-size="13">UNIQUE on the key</text>
<rect x="610" y="508" width="280" height="62" rx="12" fill="#f3e3c2"/>
<text x="632" y="532" font-size="14" font-weight="800">EXTERNAL: mail outside</text>
<text x="632" y="554" font-size="13">no rollback possible</text>
<rect x="900" y="508" width="310" height="62" rx="12" fill="#f3e3c2"/>
<text x="922" y="532" font-size="14" font-weight="800">HORIZON: keys expire 30d</text>
<text x="922" y="554" font-size="13">ACK never deletes a key</text>
</g>
<text x="620" y="610" font-size="15" text-anchor="middle">6 applications for 3 messages without dedup (175 vs 350): luck is not safety</text>
<text x="620" y="636" font-size="15" text-anchor="middle">make external receivers idempotent too, or the boundary leaks exactly-once</text>
