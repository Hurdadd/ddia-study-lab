<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFR pillars — DDIA Chapter 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&amp;family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="The four nonfunctional requirement pillars">
<title>The four nonfunctional requirement pillars</title>
<text x="620" y="58" font-size="30" font-weight="900" text-anchor="middle">Nonfunctional requirements: the four pillars</text>
<text x="620" y="94" font-size="16" text-anchor="middle">what the system must be like, not what it must do</text>
<g>
<rect x="50" y="140" width="270" height="400" rx="20" fill="#ffcfb8"/>
<text x="185" y="190" font-size="22" font-weight="800" text-anchor="middle">Performance</text>
<text x="185" y="240" font-size="15" text-anchor="middle">response time</text>
<text x="185" y="274" font-size="15" text-anchor="middle">throughput</text>
<text x="185" y="308" font-size="15" text-anchor="middle">p50 / p95 / p99</text>
<text x="185" y="342" font-size="15" text-anchor="middle">SLO + SLA</text>
<rect x="147" y="484" width="76" height="32" rx="16" fill="#f7f2e8"/>
<text x="185" y="506" font-size="14" text-anchor="middle">see s2</text>
</g>
<g>
<rect x="340" y="140" width="270" height="400" rx="20" fill="#ffe08a"/>
<text x="475" y="190" font-size="22" font-weight="800" text-anchor="middle">Reliability</text>
<text x="475" y="240" font-size="15" text-anchor="middle">fault vs failure</text>
<text x="475" y="274" font-size="15" text-anchor="middle">no SPOF</text>
<text x="475" y="308" font-size="15" text-anchor="middle">fault injection</text>
<text x="475" y="342" font-size="15" text-anchor="middle">blameless reviews</text>
<rect x="437" y="484" width="76" height="32" rx="16" fill="#f7f2e8"/>
<text x="475" y="506" font-size="14" text-anchor="middle">see s3</text>
</g>
<g>
<rect x="630" y="140" width="270" height="400" rx="20" fill="#bfe6c9"/>
<text x="765" y="190" font-size="22" font-weight="800" text-anchor="middle">Scalability</text>
<text x="765" y="240" font-size="15" text-anchor="middle">describe the load</text>
<text x="765" y="274" font-size="15" text-anchor="middle">scale up or out</text>
<text x="765" y="308" font-size="15" text-anchor="middle">revisit per 10x</text>
<text x="765" y="342" font-size="15" text-anchor="middle">minimal complexity</text>
<rect x="727" y="484" width="76" height="32" rx="16" fill="#f7f2e8"/>
<text x="765" y="506" font-size="14" text-anchor="middle">see s4</text>
</g>
<g>
<rect x="920" y="140" width="270" height="400" rx="20" fill="#c3ceff"/>
<text x="1055" y="190" font-size="22" font-weight="800" text-anchor="middle">Maintainability</text>
<text x="1055" y="240" font-size="15" text-anchor="middle">operability</text>
<text x="1055" y="274" font-size="15" text-anchor="middle">simplicity</text>
<text x="1055" y="308" font-size="15" text-anchor="middle">evolvability</text>
<text x="1055" y="342" font-size="15" text-anchor="middle">reversible change</text>
<rect x="1017" y="484" width="76" height="32" rx="16" fill="#f7f2e8"/>
<text x="1055" y="506" font-size="14" text-anchor="middle">see s5</text>
</g>
<text x="620" y="600" font-size="15" text-anchor="middle">security and compliance are out of this book's scope</text>
</svg>
</div>
</body>
</html>
