<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two wall clocks, one mocked skew — DDIA Chapter 9 Solution 2</title>
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Two wall-clock timelines with mocked skew, an NTP step, and an LWW burial">
<title>Two wall clocks, one mocked skew, one LWW burial</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#302828"/>
</marker>
</defs>
<text x="620" y="48" font-size="28" font-weight="900" text-anchor="middle">Two wall clocks, one mocked skew</text>
<text x="620" y="82" font-size="15" text-anchor="middle">MOCK is a shifted clock in a demo, never a measurement</text>
<text x="40" y="140" font-size="15" font-weight="800">host A wall (truth time)</text>
<line x1="300" y1="170" x2="1150" y2="170" stroke="#302828" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="688,150 700,161 690,172 702,185" fill="none" stroke="#b45309" stroke-width="3"/>
<text x="700" y="140" font-size="13" font-weight="700" text-anchor="middle">NTP step -500ms</text>
<polygon points="612,162 620,170 612,178 604,170" fill="#2563eb"/>
<text x="612" y="208" font-size="14" text-anchor="middle">A writes at truth t+100, wall stamp t-400</text>
<text x="1150" y="205" font-size="13" text-anchor="end">truth time</text>
<text x="40" y="300" font-size="15" font-weight="800">host B wall (MOCK +250ms)</text>
<line x1="300" y1="330" x2="1150" y2="330" stroke="#302828" stroke-width="2" marker-end="url(#arr)"/>
<polygon points="400,322 408,330 400,338 392,330" fill="#dc2626"/>
<text x="400" y="368" font-size="14" text-anchor="middle">B writes at truth t, wall stamp t+250</text>
<text x="1150" y="365" font-size="13" text-anchor="end">truth time</text>
<line x1="400" y1="170" x2="400" y2="330" stroke="#302828" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="400" y="257" font-size="13" text-anchor="middle">same truth t</text>
<line x1="612" y1="170" x2="612" y2="330" stroke="#302828" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="612" y="257" font-size="13" text-anchor="middle">truth t+100</text>
<g>
<rect x="300" y="396" width="640" height="60" rx="12" fill="#ffe08a"/>
<text x="620" y="421" font-size="15" font-weight="800" text-anchor="middle">LWW keeps B: 250 is newer than -400</text>
<text x="620" y="444" font-size="14" text-anchor="middle">the earlier write buries the later one</text>
</g>
<g>
<rect x="300" y="468" width="640" height="64" rx="12" fill="#c3ceff"/>
<text x="620" y="493" font-size="14" text-anchor="middle">sample: A asks B, RTT 40ms, raw diff 250ms</text>
<text x="620" y="516" font-size="14" text-anchor="middle">uncertainty +-20ms travels with the sample</text>
</g>
<g>
<rect x="60" y="548" width="1120" height="100" rx="12" fill="none" stroke="#ff7e49" stroke-width="2" stroke-dasharray="8 6"/>
<text x="620" y="578" font-size="15" font-weight="800" text-anchor="middle">spans on monotonic per host, stamps on wall, order never on wall</text>
<text x="620" y="602" font-size="14" text-anchor="middle">two containers on one host share a clock: use two hosts or label the MOCK</text>
<text x="620" y="626" font-size="14" text-anchor="middle">monotonic readings never cross hosts: different zeroes</text>
</g>
</svg>
</div>
</body>
</html>
