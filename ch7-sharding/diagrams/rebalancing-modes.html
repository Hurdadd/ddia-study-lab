<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebalancing modes — concept sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f7f2e8;font-family:'Nunito','Vazirmatn',system-ui,sans-serif}
  .wrap{max-width:1240px;margin:0 auto;padding:16px}
</style>
</head>
<body>
<div class="wrap">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Comparing fully automatic, human-approved and manual rebalancing">
<title>Rebalancing modes</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#302828"/>
</marker>
</defs>
<rect x="0" y="0" width="1240" height="660" rx="24" fill="#f7f2e8"/>
<text x="620" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#302828">Rebalancing: who moves the data?</text>

<rect x="60" y="88" width="340" height="60" rx="16" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<text x="230" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Fully automatic</text>
<rect x="450" y="88" width="340" height="60" rx="16" fill="#bfe6c9" stroke="#302828" stroke-width="2"/>
<text x="620" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Propose, human commits</text>
<rect x="840" y="88" width="340" height="60" rx="16" fill="#c3ceff" stroke="#302828" stroke-width="2"/>
<text x="1010" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Manual</text>

<text x="60" y="172" font-size="13" font-weight="800" fill="#302828">PLUS</text>
<rect x="60" y="184" width="340" height="88" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="230" y="220" text-anchor="middle" font-size="14" fill="#302828">no ops toil</text>
<text x="230" y="248" text-anchor="middle" font-size="14" fill="#302828">scales in minutes</text>
<rect x="450" y="184" width="340" height="88" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="620" y="220" text-anchor="middle" font-size="14" fill="#302828">no surprises</text>
<text x="620" y="248" text-anchor="middle" font-size="14" fill="#302828">admin approves</text>
<rect x="840" y="184" width="340" height="88" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="1010" y="220" text-anchor="middle" font-size="14" fill="#302828">full control</text>
<text x="1010" y="248" text-anchor="middle" font-size="14" fill="#302828">plan for big events</text>

<text x="60" y="298" font-size="13" font-weight="800" fill="#302828">MINUS</text>
<rect x="60" y="310" width="340" height="88" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="230" y="346" text-anchor="middle" font-size="14" fill="#302828">may swamp network</text>
<text x="230" y="374" text-anchor="middle" font-size="14" fill="#302828">splits lag writes</text>
<rect x="450" y="310" width="340" height="88" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="620" y="346" text-anchor="middle" font-size="14" fill="#302828">slower in crisis</text>
<text x="620" y="374" text-anchor="middle" font-size="14" fill="#302828">needs an on-call human</text>
<rect x="840" y="310" width="340" height="88" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="1010" y="346" text-anchor="middle" font-size="14" fill="#302828">human toil</text>
<text x="1010" y="374" text-anchor="middle" font-size="14" fill="#302828">slow in crisis</text>

<text x="60" y="424" font-size="13" font-weight="800" fill="#302828">FITS</text>
<rect x="60" y="436" width="340" height="56" rx="16" fill="#c3ceff" stroke="#302828" stroke-width="2"/>
<text x="230" y="471" text-anchor="middle" font-size="14" font-weight="800" fill="#302828">calm clusters</text>
<rect x="450" y="436" width="340" height="56" rx="16" fill="#bfe6c9" stroke="#302828" stroke-width="2"/>
<text x="620" y="471" text-anchor="middle" font-size="14" font-weight="800" fill="#302828">safest default</text>
<rect x="840" y="436" width="340" height="56" rx="16" fill="#c3ceff" stroke="#302828" stroke-width="2"/>
<text x="1010" y="471" text-anchor="middle" font-size="14" font-weight="800" fill="#302828">before Black Friday</text>

<rect x="60" y="524" width="1120" height="64" rx="16" fill="#ffc2da" stroke="#302828" stroke-width="2"/>
<text x="620" y="563" text-anchor="middle" font-size="15" font-weight="800" fill="#302828">auto rebalance + auto failure detection = cascading failure</text>
<text x="620" y="609" text-anchor="middle" font-size="14" font-weight="700" fill="#302828">a slow node looks dead · the cluster piles on more load</text>
</svg>
</div>
</body>
</html>
