<!DOCTYPE html>

<head>

<title>Time-series sharding measured — DDIA Chapter 7 Solution 1 assembly</title>
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}

</style>

<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 450" role="img" aria-label="Measured skew and fan-out for four time-series sharding schemes">
<title>Four schemes measured: monthly share, day-15 share, one-sensor fan-out</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#302828"/>
</marker>
</defs>
<text x="620" y="52" font-size="30" font-weight="900" text-anchor="middle">Four schemes, two clocks, one query</text>
<text x="620" y="86" font-size="16" text-anchor="middle">monthly totals hide the instantaneous hotspot — measure both, then count fan-out</text>
<rect x="24" y="150" width="1192" height="44" rx="12" fill="#fffdf7"/>
<rect x="24" y="238" width="1192" height="44" rx="12" fill="#fffdf7"/>
<line x1="24" y1="145" x2="1216" y2="145" stroke="#302828" stroke-width="2"/>
<text x="40" y="130" font-size="15" font-weight="800">scheme</text>
<text x="590" y="130" font-size="15" font-weight="800" text-anchor="middle">monthly max share</text>
<text x="830" y="130" font-size="15" font-weight="800" text-anchor="middle">day-15 max share</text>
<text x="1060" y="130" font-size="15" font-weight="800" text-anchor="middle">one-sensor fan-out</text>
<text x="40" y="179" font-size="17" font-weight="800">ts-range</text>
<text x="590" y="179" font-size="16" text-anchor="middle">13.5%</text>
<rect x="755" y="156" width="150" height="30" rx="10" fill="#ffcfb8"/>
<text x="830" y="179" font-size="16" font-weight="800" text-anchor="middle">100% today</text>
<text x="1060" y="179" font-size="16" text-anchor="middle">8 shards</text>
<text x="40" y="223" font-size="17" font-weight="800">sensor:ts</text>
<text x="590" y="223" font-size="16" text-anchor="middle">47.2%</text>
<text x="830" y="223" font-size="16" text-anchor="middle">47.0% today</text>
<text x="1060" y="223" font-size="16" text-anchor="middle">1 shard</text>
<text x="40" y="267" font-size="17" font-weight="800">hash(sensor)</text>
<text x="590" y="267" font-size="16" text-anchor="middle">48.5%</text>
<text x="830" y="267" font-size="16" text-anchor="middle">48.1% today</text>
<text x="1060" y="267" font-size="16" text-anchor="middle">1 + full scan</text>
<text x="40" y="311" font-size="17" font-weight="800">hash(full)</text>
<text x="590" y="311" font-size="16" text-anchor="middle">12.6%</text>
<text x="830" y="311" font-size="16" text-anchor="middle">13.1% today</text>
<text x="1060" y="311" font-size="16" text-anchor="middle">8 shards</text>
<line x1="24" y1="330" x2="1216" y2="330" stroke="#302828" stroke-width="2"/>
<text x="620" y="372" font-size="14" text-anchor="middle">teaching numbers: 120k writes, 51 sensors, sensor-0 at 40%, 8 shards, fixed seed</text>
<text x="620" y="402" font-size="14" text-anchor="middle">pink cell: even monthly totals, yet 100% of one day on one shard — the hot-shard trap</text>
<text x="620" y="432" font-size="14" text-anchor="middle">legend: even writes cost fan-out; locality costs skew — pick the cheap side for your queries</text>
</svg>
