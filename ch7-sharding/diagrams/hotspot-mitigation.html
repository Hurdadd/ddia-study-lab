<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neutralizing hotspots — concept sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f7f2e8;font-family:'Nunito','Vazirmatn',system-ui,sans-serif}
  .wrap{max-width:1240px;margin:0 auto;padding:16px}
</style>
</head>
<body>
<div class="wrap">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Comparing three hotspot fixes: isolation, random prefix and adaptive management">
<title>Neutralizing hotspots</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#302828"/>
</marker>
</defs>
<rect x="0" y="0" width="1240" height="660" rx="24" fill="#f7f2e8"/>
<text x="620" y="52" text-anchor="middle" font-size="24" font-weight="900" fill="#302828">Neutralizing a hotspot: three fixes</text>

<rect x="60" y="88" width="340" height="60" rx="16" fill="#ffcfb8" stroke="#302828" stroke-width="2"/>
<text x="230" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Isolate the hot key</text>
<rect x="450" y="88" width="340" height="60" rx="16" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<text x="620" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Random prefix</text>
<rect x="840" y="88" width="340" height="60" rx="16" fill="#bfe6c9" stroke="#302828" stroke-width="2"/>
<text x="1010" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Adaptive management</text>

<text x="60" y="172" font-size="13" font-weight="800" fill="#302828">WHAT IT DOES</text>
<rect x="60" y="184" width="340" height="116" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="230" y="220" text-anchor="middle" font-size="14" fill="#302828">hot key gets its own</text>
<text x="230" y="248" text-anchor="middle" font-size="14" fill="#302828">shard (own machine)</text>
<text x="230" y="276" text-anchor="middle" font-size="14" fill="#302828">range schemes only</text>
<rect x="450" y="184" width="340" height="116" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="620" y="220" text-anchor="middle" font-size="14" fill="#302828">key to 100 suffixed keys</text>
<text x="620" y="248" text-anchor="middle" font-size="14" fill="#302828">writes fan out</text>
<text x="620" y="276" text-anchor="middle" font-size="14" fill="#302828">00..99 suffix</text>
<rect x="840" y="184" width="340" height="116" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="1010" y="220" text-anchor="middle" font-size="14" fill="#302828">cloud moves load</text>
<text x="1010" y="248" text-anchor="middle" font-size="14" fill="#302828">automatic balancing</text>
<text x="1010" y="276" text-anchor="middle" font-size="14" fill="#302828">DynamoDB-style</text>

<text x="60" y="326" font-size="13" font-weight="800" fill="#302828">PRICE</text>
<rect x="60" y="338" width="340" height="116" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="230" y="374" text-anchor="middle" font-size="14" fill="#302828">must detect hot keys</text>
<text x="230" y="402" text-anchor="middle" font-size="14" fill="#302828">heat moves over time</text>
<text x="230" y="430" text-anchor="middle" font-size="14" fill="#302828">one machine per key</text>
<rect x="450" y="338" width="340" height="116" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="620" y="374" text-anchor="middle" font-size="14" fill="#302828">reads merge 100 keys</text>
<text x="620" y="402" text-anchor="middle" font-size="14" fill="#302828">writes only, not reads</text>
<text x="620" y="430" text-anchor="middle" font-size="14" fill="#302828">needs hot-key tracking</text>
<rect x="840" y="338" width="340" height="116" rx="16" fill="#fffdf7" stroke="#302828" stroke-width="2"/>
<text x="1010" y="374" text-anchor="middle" font-size="14" fill="#302828">opaque behavior</text>
<text x="1010" y="402" text-anchor="middle" font-size="14" fill="#302828">vendor-specific</text>
<text x="1010" y="430" text-anchor="middle" font-size="14" fill="#302828">surprises possible</text>

<text x="60" y="480" font-size="13" font-weight="800" fill="#302828">FITS</text>
<rect x="60" y="492" width="340" height="56" rx="16" fill="#c3ceff" stroke="#302828" stroke-width="2"/>
<text x="230" y="527" text-anchor="middle" font-size="14" font-weight="800" fill="#302828">rare, known hot keys</text>
<rect x="450" y="492" width="340" height="56" rx="16" fill="#c3ceff" stroke="#302828" stroke-width="2"/>
<text x="620" y="527" text-anchor="middle" font-size="14" font-weight="800" fill="#302828">write-hot counters</text>
<rect x="840" y="492" width="340" height="56" rx="16" fill="#c3ceff" stroke="#302828" stroke-width="2"/>
<text x="1010" y="527" text-anchor="middle" font-size="14" font-weight="800" fill="#302828">managed clouds</text>

<text x="620" y="606" text-anchor="middle" font-size="14" font-weight="700" fill="#302828">hashing spreads keys, not load · write-hot differs from read-hot</text>
</svg>
</div>
</body>
</html>
