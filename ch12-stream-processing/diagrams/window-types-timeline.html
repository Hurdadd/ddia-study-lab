<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Window Types on the Event-Time Axis — Tumbling, Hopping, Sliding, Session</title>
<style>
  html,body{margin:0;background:#0b111c;color:#e8edf7;
    font-family:'Vazirmatn',system-ui,sans-serif;}
  .stage{width:100%; display:flex; justify-content:center; padding:10px 0;}
  svg{width:100%; height:auto; max-width:1240px;}
  .ttl{font:700 19px system-ui,sans-serif; fill:#5eead4}
  .sub{font:13px system-ui,sans-serif; fill:#a7b3cc}
  .pill-t{font:700 12px ui-monospace,Menlo,monospace; fill:#0b111c}
  .desc{font:11px ui-monospace,Menlo,monospace; fill:#a7b3cc}
  .lbl{font:11.5px ui-monospace,Menlo,monospace; fill:#cfe3ff}
  .micro{font:10.5px ui-monospace,Menlo,monospace; fill:#94a3b8}
  .note{font:700 11.5px ui-monospace,Menlo,monospace; fill:#86efac}
  .warn{font:700 11.5px ui-monospace,Menlo,monospace; fill:#fbbf24}
  .tick{font:11px ui-monospace,Menlo,monospace; fill:#a7b3cc}
  .lgd{font:11.5px ui-monospace,Menlo,monospace; fill:#a7b3cc}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1240 660" role="img" aria-label="Four stacked event-time mini axes on one shared 0-to-10 minute scale comparing tumbling windows of one minute, hopping windows of five minutes with a one-minute hop, sliding windows of five minutes that follow the events, and session windows that end after thirty minutes of inactivity">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a7b3cc"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#86efac"/>
    </marker>
  </defs>

  <text class="ttl" x="620" y="28" text-anchor="middle">Four Window Types on the Event-Time Axis (Tumbling, Hopping, Sliding, Session)</text>
  <text class="sub" x="620" y="50" text-anchor="middle">one shared event-time scale &#183; the same stream of events, four ways of grouping them into windows</text>

  <!-- legend -->
  <g>
    <circle cx="430" cy="75" r="4.5" fill="#93c5fd"/>
    <text class="lgd" x="442" y="80">event</text>
    <rect x="500" y="68" width="22" height="14" rx="4" fill="#1b2438" stroke="#86efac" stroke-width="1.4"/>
    <text class="lgd" x="530" y="80">window</text>
    <rect x="600" y="68" width="22" height="14" rx="4" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text class="lgd" x="630" y="80">fixed 1-min window (for contrast)</text>
  </g>

  <!-- shared minute gridlines -->
  <g stroke="#2a3652" stroke-width="1" stroke-dasharray="3 5" opacity="0.55">
    <line x1="210" y1="94" x2="210" y2="586"/>
    <line x1="304" y1="94" x2="304" y2="586"/>
    <line x1="398" y1="94" x2="398" y2="586"/>
    <line x1="492" y1="94" x2="492" y2="586"/>
    <line x1="586" y1="94" x2="586" y2="586"/>
    <line x1="680" y1="94" x2="680" y2="586"/>
    <line x1="774" y1="94" x2="774" y2="586"/>
    <line x1="868" y1="94" x2="868" y2="586"/>
    <line x1="962" y1="94" x2="962" y2="586"/>
    <line x1="1056" y1="94" x2="1056" y2="586"/>
    <line x1="1150" y1="94" x2="1150" y2="586"/>
  </g>

  <!-- ============ BAND 1 : tumbling ============ -->
  <g>
    <rect x="20" y="94" width="1200" height="104" rx="10" fill="#161d2e" stroke="#2a3652" stroke-width="1.4"/>
    <rect x="32" y="102" width="140" height="26" rx="13" fill="#0e7490" stroke="#2a3652" stroke-width="1.3"/>
    <text class="pill-t" x="102" y="119" text-anchor="middle">Tumbling</text>
    <text class="desc" x="32" y="146">fixed size, no overlap</text>

    <g fill="#1b2438" stroke="#93c5fd" stroke-width="1.4">
      <rect x="210" y="108" width="94" height="30" rx="5"/>
      <rect x="304" y="108" width="94" height="30" rx="5"/>
      <rect x="398" y="108" width="94" height="30" rx="5"/>
      <rect x="492" y="108" width="94" height="30" rx="5"/>
      <rect x="586" y="108" width="94" height="30" rx="5"/>
      <rect x="680" y="108" width="94" height="30" rx="5"/>
      <rect x="774" y="108" width="94" height="30" rx="5"/>
      <rect x="868" y="108" width="94" height="30" rx="5"/>
      <rect x="962" y="108" width="94" height="30" rx="5"/>
      <rect x="1056" y="108" width="94" height="30" rx="5"/>
    </g>
    <g class="lbl" text-anchor="middle">
      <text class="lbl" x="257" y="127">[0,1)</text>
      <text class="lbl" x="351" y="127">[1,2)</text>
      <text class="lbl" x="445" y="127">[2,3)</text>
      <text class="lbl" x="539" y="127">[3,4)</text>
      <text class="lbl" x="633" y="127">[4,5)</text>
      <text class="lbl" x="727" y="127">[5,6)</text>
      <text class="lbl" x="821" y="127">[6,7)</text>
      <text class="lbl" x="915" y="127">[7,8)</text>
      <text class="lbl" x="1009" y="127">[8,9)</text>
      <text class="lbl" x="1103" y="127">[9,10)</text>
    </g>

    <line x1="210" y1="170" x2="1150" y2="170" stroke="#2a3652" stroke-width="1.6"/>
    <g fill="#93c5fd">
      <circle cx="238.2" cy="170" r="4"/><circle cx="275.8" cy="170" r="4"/>
      <circle cx="313.4" cy="170" r="4"/><circle cx="351" cy="170" r="4"/>
      <circle cx="388.6" cy="170" r="4"/><circle cx="435.6" cy="170" r="4"/>
      <circle cx="473.2" cy="170" r="4"/><circle cx="520.2" cy="170" r="4"/>
      <circle cx="576.6" cy="170" r="4"/><circle cx="623.6" cy="170" r="4"/>
      <circle cx="698.8" cy="170" r="4"/><circle cx="764.6" cy="170" r="4"/>
      <circle cx="802.2" cy="170" r="4"/><circle cx="849.2" cy="170" r="4"/>
      <circle cx="905.2" cy="170" r="4"/><circle cx="971" cy="170" r="4"/>
      <circle cx="1018" cy="170" r="4"/><circle cx="1074.8" cy="170" r="4"/>
      <circle cx="1121.8" cy="170" r="4"/>
    </g>
    <text class="note" x="1150" y="192" text-anchor="end">each event belongs to exactly one window</text>
  </g>

  <!-- ============ BAND 2 : hopping ============ -->
  <g>
    <rect x="20" y="204" width="1200" height="118" rx="10" fill="#161d2e" stroke="#2a3652" stroke-width="1.4"/>
    <rect x="32" y="212" width="140" height="26" rx="13" fill="#0e7490" stroke="#2a3652" stroke-width="1.3"/>
    <text class="pill-t" x="102" y="229" text-anchor="middle">Hopping</text>
    <text class="desc" x="32" y="256">fixed size, fixed hop</text>

    <text class="micro" x="218" y="214">each window is 5 min long</text>
    <text class="micro" x="1150" y="214" text-anchor="end">windows start 1 min apart</text>

    <g fill="#93c5fd" fill-opacity="0.13" stroke="#93c5fd" stroke-width="1.3">
      <rect x="210" y="218" width="470" height="18" rx="4"/>
      <rect x="304" y="229" width="470" height="18" rx="4"/>
      <rect x="398" y="240" width="470" height="18" rx="4"/>
      <rect x="492" y="251" width="470" height="18" rx="4"/>
      <rect x="586" y="262" width="470" height="18" rx="4"/>
      <rect x="680" y="273" width="470" height="18" rx="4"/>
    </g>
    <g class="lbl">
      <text class="lbl" x="218" y="230">[0,5)</text>
      <text class="lbl" x="312" y="241">[1,6)</text>
      <text class="lbl" x="406" y="252">[2,7)</text>
      <text class="lbl" x="500" y="263">[3,8)</text>
      <text class="lbl" x="594" y="274">[4,9)</text>
      <text class="lbl" x="688" y="285">[5,10)</text>
    </g>

    <line x1="210" y1="296" x2="304" y2="296" stroke="#fbbf24" stroke-width="1.8" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
    <text class="warn" x="257" y="308" text-anchor="middle">1 min hop</text>
    <text class="note" x="1150" y="308" text-anchor="end">overlap provides smoothing</text>
  </g>

  <!-- ============ BAND 3 : sliding ============ -->
  <g>
    <rect x="20" y="328" width="1200" height="116" rx="10" fill="#161d2e" stroke="#2a3652" stroke-width="1.4"/>
    <rect x="32" y="336" width="140" height="26" rx="13" fill="#0e7490" stroke="#2a3652" stroke-width="1.3"/>
    <text class="pill-t" x="102" y="353" text-anchor="middle">Sliding</text>
    <text class="desc" x="32" y="380">slides with each event</text>

    <!-- fixed 1-min windows that would split the pair -->
    <g fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4">
      <rect x="282" y="336" width="84" height="16" rx="4"/>
      <rect x="671" y="336" width="84" height="16" rx="4"/>
    </g>
    <text class="micro" x="324" y="348" text-anchor="middle">fixed [3,4)</text>
    <text class="micro" x="713" y="348" text-anchor="middle">fixed [7,8)</text>

    <!-- one 5-min sliding window anchored at e1 -->
    <rect x="282" y="358" width="470" height="28" rx="6" fill="#86efac" fill-opacity="0.16" stroke="#86efac" stroke-width="1.6"/>
    <text class="note" x="517" y="376" text-anchor="middle">5-min sliding window [3.0, 8.0)</text>

    <line x1="282" y1="400" x2="713" y2="400" stroke="#fbbf24" stroke-width="1.8" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
    <text class="warn" x="497" y="396" text-anchor="middle">4.5 min apart &#8212; different fixed windows</text>

    <line x1="210" y1="416" x2="1150" y2="416" stroke="#2a3652" stroke-width="1.6"/>
    <g fill="#93c5fd">
      <circle cx="266.4" cy="416" r="4"/><circle cx="379.2" cy="416" r="4"/>
      <circle cx="642.4" cy="416" r="4"/><circle cx="811.6" cy="416" r="4"/>
      <circle cx="1084.2" cy="416" r="4"/>
    </g>
    <circle cx="282" cy="416" r="5.5" fill="#86efac"/>
    <circle cx="713" cy="416" r="5.5" fill="#86efac"/>
    <text class="lbl" x="282" y="434" text-anchor="middle">e1 = 3.0 min</text>
    <text class="lbl" x="713" y="434" text-anchor="middle">e2 = 7.5 min</text>
    <text class="note" x="1150" y="434" text-anchor="end">window follows the events</text>
  </g>

  <!-- ============ BAND 4 : session ============ -->
  <g>
    <rect x="20" y="450" width="1200" height="114" rx="10" fill="#161d2e" stroke="#2a3652" stroke-width="1.4"/>
    <rect x="32" y="458" width="140" height="26" rx="13" fill="#0e7490" stroke="#2a3652" stroke-width="1.3"/>
    <text class="pill-t" x="102" y="475" text-anchor="middle">Session</text>
    <text class="desc" x="32" y="502">gap-based,</text>
    <text class="desc" x="32" y="518">variable width</text>

    <g fill="#1b2438" stroke="#86efac" stroke-width="1.6">
      <rect x="238.2" y="470" width="178.6" height="30" rx="6"/>
      <rect x="520.2" y="470" width="122.2" height="30" rx="6"/>
      <rect x="774" y="470" width="112.8" height="30" rx="6"/>
    </g>
    <g class="lbl" text-anchor="middle">
      <text class="lbl" x="327" y="490">session A</text>
      <text class="lbl" x="581" y="490">session B</text>
      <text class="lbl" x="830" y="490">session C</text>
    </g>

    <line x1="210" y1="516" x2="1150" y2="516" stroke="#2a3652" stroke-width="1.6"/>
    <g fill="#93c5fd">
      <circle cx="257" cy="516" r="4"/><circle cx="294.6" cy="516" r="4"/>
      <circle cx="341.6" cy="516" r="4"/><circle cx="388.6" cy="516" r="4"/>
      <circle cx="538.6" cy="516" r="4"/><circle cx="576.2" cy="516" r="4"/>
      <circle cx="623.2" cy="516" r="4"/>
      <circle cx="793" cy="516" r="4"/><circle cx="830.6" cy="516" r="4"/>
      <circle cx="868.2" cy="516" r="4"/>
    </g>

    <!-- inactivity gaps -->
    <g stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="6 5">
      <line x1="416.8" y1="528" x2="520.2" y2="528"/>
      <line x1="416.8" y1="523" x2="416.8" y2="533"/>
      <line x1="520.2" y1="523" x2="520.2" y2="533"/>
      <line x1="642.4" y1="528" x2="774" y2="528"/>
      <line x1="642.4" y1="523" x2="642.4" y2="533"/>
      <line x1="774" y1="523" x2="774" y2="533"/>
    </g>
    <text class="desc" x="708" y="538" text-anchor="middle">same rule</text>
    <text class="warn" x="468" y="552" text-anchor="middle">30 min inactivity &#8594; session ends</text>
    <text class="note" x="1150" y="552" text-anchor="end">no fixed duration</text>
  </g>

  <!-- ============ shared bottom axis ============ -->
  <line x1="210" y1="586" x2="1150" y2="586" stroke="#a7b3cc" stroke-width="2" marker-end="url(#arr)"/>
  <g stroke="#a7b3cc" stroke-width="1.4">
    <line x1="210" y1="586" x2="210" y2="592"/>
    <line x1="304" y1="586" x2="304" y2="592"/>
    <line x1="398" y1="586" x2="398" y2="592"/>
    <line x1="492" y1="586" x2="492" y2="592"/>
    <line x1="586" y1="586" x2="586" y2="592"/>
    <line x1="680" y1="586" x2="680" y2="592"/>
    <line x1="774" y1="586" x2="774" y2="592"/>
    <line x1="868" y1="586" x2="868" y2="592"/>
    <line x1="962" y1="586" x2="962" y2="592"/>
    <line x1="1056" y1="586" x2="1056" y2="592"/>
    <line x1="1150" y1="586" x2="1150" y2="592"/>
  </g>
  <g class="tick" text-anchor="middle">
    <text class="tick" x="210" y="606">0</text>
    <text class="tick" x="304" y="606">1</text>
    <text class="tick" x="398" y="606">2</text>
    <text class="tick" x="492" y="606">3</text>
    <text class="tick" x="586" y="606">4</text>
    <text class="tick" x="680" y="606">5</text>
    <text class="tick" x="774" y="606">6</text>
    <text class="tick" x="868" y="606">7</text>
    <text class="tick" x="962" y="606">8</text>
    <text class="tick" x="1056" y="606">9</text>
    <text class="tick" x="1150" y="606">10</text>
  </g>
  <text class="tick" x="210" y="626">shared event-time scale</text>
  <text class="tick" x="1150" y="626" text-anchor="end">event time (minutes) &#8594;</text>
</svg>
</div>
</body>
</html>
