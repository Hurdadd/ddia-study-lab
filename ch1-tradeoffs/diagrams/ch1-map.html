<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 1 Map — Every Trade-off at a Glance (DDIA)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#f7f2e8;color:#302828;font-family:'Nunito','Vazirmatn',system-ui,sans-serif;}
  .stage{width:100%;display:flex;justify-content:center;padding:10px 0;}
  svg{width:100%;height:auto;max-width:1240px;}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Chapter map: central Chapter 1 trade-offs node connected to six concept nodes with question edges" font-family="Nunito, Vazirmatn, sans-serif">
<title>Chapter 1 trade-offs map</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6b5f5c"/>
</marker>
</defs>
<rect x="0" y="0" width="1240" height="660" rx="0" fill="#f7f2e8"/>

<text x="620" y="42" text-anchor="middle" font-size="23" font-weight="800" fill="#302828">Chapter 1 Map — Every Trade-off at a Glance</text>
<text x="620" y="68" text-anchor="middle" font-size="14" fill="#6b5f5c">no solutions, only trade-offs · every edge asks a question</text>

<!-- edges first, labels on halos above them -->
<line x1="540" y1="288" x2="250" y2="204" stroke="#6b5f5c" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="620" y1="288" x2="620" y2="204" stroke="#6b5f5c" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="700" y1="288" x2="990" y2="204" stroke="#6b5f5c" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="540" y1="372" x2="250" y2="456" stroke="#6b5f5c" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="620" y1="372" x2="620" y2="456" stroke="#6b5f5c" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="700" y1="372" x2="990" y2="456" stroke="#6b5f5c" stroke-width="2.5" marker-end="url(#arr)"/>

<!-- top nodes -->
<rect x="80" y="120" width="260" height="84" rx="16" fill="#bfe6c9" stroke="#302828" stroke-width="2"/>
<text x="210" y="155" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">OLTP vs OLAP</text>
<text x="210" y="181" text-anchor="middle" font-size="13" fill="#302828">create vs analyze</text>

<rect x="490" y="120" width="260" height="84" rx="16" fill="#c3ceff" stroke="#302828" stroke-width="2"/>
<text x="620" y="155" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Record vs Derived</text>
<text x="620" y="181" text-anchor="middle" font-size="13" fill="#302828">truth vs rebuildable copies</text>

<rect x="900" y="120" width="260" height="84" rx="16" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<text x="1030" y="155" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Warehouse vs Lake</text>
<text x="1030" y="181" text-anchor="middle" font-size="13" fill="#302828">curated vs raw files</text>

<!-- center node -->
<rect x="490" y="288" width="260" height="84" rx="16" fill="#ffcfb8" stroke="#302828" stroke-width="2.5"/>
<text x="620" y="323" text-anchor="middle" font-size="17" font-weight="800" fill="#302828">CHAPTER 1</text>
<text x="620" y="351" text-anchor="middle" font-size="14" fill="#302828">trade-offs, not solutions</text>

<!-- bottom nodes -->
<rect x="80" y="456" width="260" height="84" rx="16" fill="#ffc2da" stroke="#302828" stroke-width="2"/>
<text x="210" y="491" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Cloud vs Self-host</text>
<text x="210" y="517" text-anchor="middle" font-size="13" fill="#302828">buy or build?</text>

<rect x="490" y="456" width="260" height="84" rx="16" fill="#d3c3f2" stroke="#302828" stroke-width="2"/>
<text x="620" y="491" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Single vs Distributed</text>
<text x="620" y="517" text-anchor="middle" font-size="13" fill="#302828">distribute last</text>

<rect x="900" y="456" width="260" height="84" rx="16" fill="#bfe6c9" stroke="#302828" stroke-width="2"/>
<text x="1030" y="491" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Data, Law, Society</text>
<text x="1030" y="517" text-anchor="middle" font-size="13" fill="#302828">keep vs minimize</text>

<!-- edge label halos + labels -->
<rect x="249" y="229" width="133" height="24" rx="12" fill="#f7f2e8" stroke="#8a7f7c" stroke-width="1"/>
<text x="315" y="246" text-anchor="middle" font-size="13" fill="#302828">who is it for?</text>

<rect x="534" y="229" width="172" height="24" rx="12" fill="#f7f2e8" stroke="#8a7f7c" stroke-width="1"/>
<text x="620" y="246" text-anchor="middle" font-size="13" fill="#302828">where is the truth?</text>

<rect x="851" y="229" width="149" height="24" rx="12" fill="#f7f2e8" stroke="#8a7f7c" stroke-width="1"/>
<text x="925" y="246" text-anchor="middle" font-size="13" fill="#302828">where to analyze?</text>

<rect x="257" y="397" width="117" height="24" rx="12" fill="#f7f2e8" stroke="#8a7f7c" stroke-width="1"/>
<text x="315" y="414" text-anchor="middle" font-size="13" fill="#302828">build or buy?</text>

<rect x="553" y="397" width="133" height="24" rx="12" fill="#f7f2e8" stroke="#8a7f7c" stroke-width="1"/>
<text x="620" y="414" text-anchor="middle" font-size="13" fill="#302828">name the reason</text>

<rect x="866" y="397" width="117" height="24" rx="12" fill="#f7f2e8" stroke="#8a7f7c" stroke-width="1"/>
<text x="925" y="414" text-anchor="middle" font-size="13" fill="#302828">at what price?</text>

<text x="620" y="590" text-anchor="middle" font-size="14" font-weight="700" fill="#302828">read it as: each arrow asks a question · each answer names its price</text>
<text x="620" y="616" text-anchor="middle" font-size="13" fill="#302828">single-node first · cache is derived · local disk is a cache · timeout means unknown</text>
</svg>
</div>
</body>
</html>
