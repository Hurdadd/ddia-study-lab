<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build or Buy — The Cloud Outsourcing Spectrum (DDIA Chapter 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#f7f2e8;color:#302828;font-family:'Nunito','Vazirmatn',system-ui,sans-serif;}
  .stage{width:100%;display:flex;justify-content:center;padding:10px 0;}
  svg{width:100%;height:auto;max-width:1240px;}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Spectrum from bespoke software to self-hosted to cloud SaaS, when each side wins, and four cloud risks" font-family="Nunito, Vazirmatn, sans-serif">
<title>Cloud build-or-buy spectrum</title>
<rect x="0" y="0" width="1240" height="660" rx="0" fill="#f7f2e8"/>

<text x="620" y="42" text-anchor="middle" font-size="23" font-weight="800" fill="#302828">Build or Buy — The Cloud Outsourcing Spectrum</text>
<text x="620" y="68" text-anchor="middle" font-size="14" fill="#6b5f5c">rule of thumb: build what is your edge · buy the commodity rest</text>

<!-- spectrum segments -->
<rect x="60" y="100" width="360" height="76" rx="16" fill="#ffcfb8" stroke="#302828" stroke-width="2"/>
<text x="240" y="130" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">1 · BESPOKE</text>
<text x="240" y="156" text-anchor="middle" font-size="14" fill="#302828">you write it, you run it</text>

<rect x="440" y="100" width="360" height="76" rx="16" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<text x="620" y="130" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">2 · SELF-HOSTED</text>
<text x="620" y="156" text-anchor="middle" font-size="14" fill="#302828">packaged SW on your servers</text>

<rect x="820" y="100" width="360" height="76" rx="16" fill="#bfe6c9" stroke="#302828" stroke-width="2"/>
<text x="1000" y="130" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">3 · CLOUD / SaaS</text>
<text x="1000" y="156" text-anchor="middle" font-size="14" fill="#302828">consume through an API</text>

<text x="240" y="202" text-anchor="middle" font-size="14" fill="#6b5f5c">control decreases this way</text>
<text x="620" y="202" text-anchor="middle" font-size="14" fill="#6b5f5c">pick your trade-off</text>
<text x="1000" y="202" text-anchor="middle" font-size="14" fill="#6b5f5c">convenience grows this way</text>

<!-- when each side wins -->
<rect x="40" y="230" width="570" height="210" rx="16" fill="#bfe6c9" stroke="#302828" stroke-width="2"/>
<text x="325" y="264" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">CLOUD WINS WHEN</text>
<text x="70" y="300" font-size="14" fill="#302828">· you cannot operate it yourself</text>
<text x="70" y="336" font-size="14" fill="#302828">· workload swings wildly</text>
<text x="70" y="372" font-size="14" fill="#302828">· speed beats control today</text>
<text x="70" y="408" font-size="14" fill="#302828">· team stays on higher problems</text>

<rect x="630" y="230" width="570" height="210" rx="16" fill="#c3ceff" stroke="#302828" stroke-width="2"/>
<text x="915" y="264" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">SELF-HOST WINS WHEN</text>
<text x="660" y="300" font-size="14" fill="#302828">· you have ops experience</text>
<text x="660" y="336" font-size="14" fill="#302828">· load is flat and predictable</text>
<text x="660" y="372" font-size="14" fill="#302828">· control or tuning is the edge</text>
<text x="660" y="408" font-size="14" fill="#302828">· e.g. high-frequency trading</text>

<!-- risks -->
<text x="620" y="478" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">FOUR CLOUD RISKS</text>

<rect x="40" y="498" width="275" height="104" rx="16" fill="#ffcfb8" stroke="#302828" stroke-width="2"/>
<text x="177" y="532" text-anchor="middle" font-size="15" font-weight="800" fill="#302828">No control</text>
<text x="177" y="560" text-anchor="middle" font-size="14" fill="#302828">outages, slow debug</text>

<rect x="335" y="498" width="275" height="104" rx="16" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<text x="472" y="532" text-anchor="middle" font-size="15" font-weight="800" fill="#302828">Lock-in</text>
<text x="472" y="560" text-anchor="middle" font-size="14" fill="#302828">migration costs hurt</text>

<rect x="630" y="498" width="275" height="104" rx="16" fill="#ffc2da" stroke="#302828" stroke-width="2"/>
<text x="767" y="532" text-anchor="middle" font-size="15" font-weight="800" fill="#302828">Geopolitics</text>
<text x="767" y="560" text-anchor="middle" font-size="14" fill="#302828">sanctions cut access</text>

<rect x="925" y="498" width="275" height="104" rx="16" fill="#d3c3f2" stroke="#302828" stroke-width="2"/>
<text x="1062" y="532" text-anchor="middle" font-size="15" font-weight="800" fill="#302828">Trust</text>
<text x="1062" y="560" text-anchor="middle" font-size="14" fill="#302828">vendor guards your data</text>

<text x="620" y="640" text-anchor="middle" font-size="14" font-weight="700" fill="#302828">ops golden line: capacity planning becomes financial planning</text>
</svg>
</div>
</body>
</html>
