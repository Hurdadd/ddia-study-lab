<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLTP vs OLAP — Two Lives of Data (DDIA Chapter 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#f7f2e8;color:#302828;font-family:'Nunito','Vazirmatn',system-ui,sans-serif;}
  .stage{width:100%;display:flex;justify-content:center;padding:10px 0;}
  svg{width:100%;height:auto;max-width:1240px;}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 880" role="img" aria-label="Comparison of OLTP and OLAP across seven rows, plus four reasons not to run analytics on the operational database" font-family="Nunito, Vazirmatn, sans-serif">
<title>OLTP vs OLAP comparison</title>
<rect x="0" y="0" width="1240" height="880" rx="0" fill="#f7f2e8"/>

<text x="620" y="42" text-anchor="middle" font-size="23" font-weight="800" fill="#302828">OLTP vs OLAP — Two Lives of Data</text>
<text x="620" y="68" text-anchor="middle" font-size="14" fill="#6b5f5c">operational systems create data · analytical systems aggregate copies of it</text>

<!-- column headers -->
<rect x="40" y="96" width="560" height="64" rx="16" fill="#bfe6c9" stroke="#302828" stroke-width="2"/>
<text x="320" y="123" text-anchor="middle" font-size="17" font-weight="800" fill="#302828">OLTP · OPERATIONAL</text>
<text x="320" y="147" text-anchor="middle" font-size="14" fill="#302828">point queries · latest state · e.g. is it allowed?</text>

<rect x="640" y="96" width="560" height="64" rx="16" fill="#c3ceff" stroke="#302828" stroke-width="2"/>
<text x="920" y="123" text-anchor="middle" font-size="17" font-weight="800" fill="#302828">OLAP · ANALYTICAL</text>
<text x="920" y="147" text-anchor="middle" font-size="14" fill="#302828">scans + aggregates · history · e.g. fraud patterns</text>

<!-- row 0 READ -->
<rect x="40" y="176" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<rect x="522" y="176" width="196" height="52" rx="26" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<rect x="730" y="176" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<text x="275" y="208" text-anchor="middle" font-size="14" fill="#302828">look up rows by key</text>
<text x="620" y="209" text-anchor="middle" font-size="13" font-weight="800" fill="#302828">READ</text>
<text x="965" y="208" text-anchor="middle" font-size="14" fill="#302828">scan millions + aggregate</text>

<!-- row 1 WRITE -->
<rect x="40" y="238" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<rect x="522" y="238" width="196" height="52" rx="26" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<rect x="730" y="238" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<text x="275" y="270" text-anchor="middle" font-size="14" fill="#302828">write one row at a time</text>
<text x="620" y="271" text-anchor="middle" font-size="13" font-weight="800" fill="#302828">WRITE</text>
<text x="965" y="270" text-anchor="middle" font-size="14" fill="#302828">bulk load or event stream</text>

<!-- row 2 USER -->
<rect x="40" y="300" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<rect x="522" y="300" width="196" height="52" rx="26" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<rect x="730" y="300" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<text x="275" y="332" text-anchor="middle" font-size="14" fill="#302828">end user, web or mobile</text>
<text x="620" y="333" text-anchor="middle" font-size="13" font-weight="800" fill="#302828">USER</text>
<text x="965" y="332" text-anchor="middle" font-size="14" fill="#302828">analyst, internal reports</text>

<!-- row 3 QUERIES -->
<rect x="40" y="362" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<rect x="522" y="362" width="196" height="52" rx="26" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<rect x="730" y="362" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<text x="275" y="394" text-anchor="middle" font-size="14" fill="#302828">fixed queries in app code</text>
<text x="620" y="395" text-anchor="middle" font-size="13" font-weight="800" fill="#302828">QUERIES</text>
<text x="965" y="394" text-anchor="middle" font-size="14" fill="#302828">ad-hoc, exploratory SQL</text>

<!-- row 4 VOLUME -->
<rect x="40" y="424" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<rect x="522" y="424" width="196" height="52" rx="26" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<rect x="730" y="424" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<text x="275" y="456" text-anchor="middle" font-size="14" fill="#302828">many tiny queries</text>
<text x="620" y="457" text-anchor="middle" font-size="13" font-weight="800" fill="#302828">VOLUME</text>
<text x="965" y="456" text-anchor="middle" font-size="14" fill="#302828">few heavy queries</text>

<!-- row 5 MEANING -->
<rect x="40" y="486" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<rect x="522" y="486" width="196" height="52" rx="26" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<rect x="730" y="486" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<text x="275" y="518" text-anchor="middle" font-size="14" fill="#302828">latest current state</text>
<text x="620" y="519" text-anchor="middle" font-size="13" font-weight="800" fill="#302828">MEANING</text>
<text x="965" y="518" text-anchor="middle" font-size="14" fill="#302828">history of events</text>

<!-- row 6 SIZE -->
<rect x="40" y="548" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<rect x="522" y="548" width="196" height="52" rx="26" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<rect x="730" y="548" width="470" height="52" rx="16" fill="#fffdf7" stroke="#8a7f7c" stroke-width="1.5"/>
<text x="275" y="580" text-anchor="middle" font-size="14" fill="#302828">gigabytes to terabytes</text>
<text x="620" y="581" text-anchor="middle" font-size="13" font-weight="800" fill="#302828">SIZE</text>
<text x="965" y="580" text-anchor="middle" font-size="14" fill="#302828">terabytes to petabytes</text>

<!-- four reasons band -->
<text x="620" y="640" text-anchor="middle" font-size="16" font-weight="800" fill="#302828">Why not analyze on the OLTP database? Four answers:</text>

<rect x="40" y="660" width="275" height="120" rx="16" fill="#ffcfb8" stroke="#302828" stroke-width="2"/>
<text x="177" y="693" text-anchor="middle" font-size="15" font-weight="800" fill="#302828">1 · SILOS</text>
<text x="177" y="719" text-anchor="middle" font-size="14" fill="#302828">data lives in dozens</text>
<text x="177" y="743" text-anchor="middle" font-size="14" fill="#302828">of separate systems</text>

<rect x="335" y="660" width="275" height="120" rx="16" fill="#ffe08a" stroke="#302828" stroke-width="2"/>
<text x="472" y="693" text-anchor="middle" font-size="15" font-weight="800" fill="#302828">2 · SCHEMA</text>
<text x="472" y="719" text-anchor="middle" font-size="14" fill="#302828">good OLTP schema is</text>
<text x="472" y="743" text-anchor="middle" font-size="14" fill="#302828">a bad analytics schema</text>

<rect x="630" y="660" width="275" height="120" rx="16" fill="#bfe6c9" stroke="#302828" stroke-width="2"/>
<text x="767" y="693" text-anchor="middle" font-size="15" font-weight="800" fill="#302828">3 · COST</text>
<text x="767" y="719" text-anchor="middle" font-size="14" fill="#302828">heavy scans would starve</text>
<text x="767" y="743" text-anchor="middle" font-size="14" fill="#302828">live users</text>

<rect x="925" y="660" width="275" height="120" rx="16" fill="#c3ceff" stroke="#302828" stroke-width="2"/>
<text x="1062" y="693" text-anchor="middle" font-size="15" font-weight="800" fill="#302828">4 · ACCESS</text>
<text x="1062" y="719" text-anchor="middle" font-size="14" fill="#302828">direct access is often</text>
<text x="1062" y="743" text-anchor="middle" font-size="14" fill="#302828">banned for security</text>

<text x="620" y="824" text-anchor="middle" font-size="14" font-weight="700" fill="#302828">takeaway: OLTP serves the present · OLAP explains the past</text>
</svg>
</div>
</body>
</html>
