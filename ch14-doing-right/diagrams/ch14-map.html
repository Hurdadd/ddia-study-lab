<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter map — doing the right thing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f7f2e8;display:flex;justify-content:center;padding:16px;font-family:'Nunito',system-ui,sans-serif}
  .stage{width:100%;max-width:1280px}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Chapter map of doing the right thing">
  <title>Chapter map: doing the right thing and its seven ethics concepts</title>
  <rect x="0" y="0" width="1240" height="660" rx="24" fill="#f7f2e8"/>
  <text x="620" y="52" font-size="27" font-weight="900" text-anchor="middle" fill="#302828">Doing the Right Thing: Chapter Map</text>
  <text x="620" y="86" font-size="15" text-anchor="middle" fill="#6e665c">every system has a purpose — and every purpose has consequences for people</text>

  <!-- edges (behind nodes) -->
  <line x1="380" y1="170" x2="470" y2="290" stroke="#9b9184" stroke-width="3"/>
  <line x1="380" y1="330" x2="470" y2="330" stroke="#9b9184" stroke-width="3"/>
  <line x1="380" y1="490" x2="470" y2="370" stroke="#9b9184" stroke-width="3"/>
  <line x1="770" y1="290" x2="860" y2="170" stroke="#9b9184" stroke-width="3"/>
  <line x1="770" y1="330" x2="860" y2="330" stroke="#9b9184" stroke-width="3"/>
  <line x1="770" y1="370" x2="860" y2="490" stroke="#9b9184" stroke-width="3"/>
  <line x1="620" y1="375" x2="620" y2="505" stroke="#9b9184" stroke-width="3"/>

  <!-- left satellites -->
  <rect x="60" y="120" width="320" height="100" rx="18" fill="#ffcfb8"/>
  <text x="220" y="158" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">Predictive analytics</text>
  <text x="220" y="184" font-size="13" text-anchor="middle" fill="#302828">scores people, not weather</text>

  <rect x="60" y="280" width="320" height="100" rx="18" fill="#ffe08a"/>
  <text x="220" y="318" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">Bias and discrimination</text>
  <text x="220" y="344" font-size="13" text-anchor="middle" fill="#302828">proxies rebuild locked traits</text>

  <rect x="60" y="440" width="320" height="100" rx="18" fill="#ffc2da"/>
  <text x="220" y="478" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">Feedback loops</text>
  <text x="220" y="504" font-size="13" text-anchor="middle" fill="#302828">output becomes next input</text>

  <!-- right satellites -->
  <rect x="860" y="120" width="320" height="100" rx="18" fill="#c3ceff"/>
  <text x="1020" y="158" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">Surveillance</text>
  <text x="1020" y="184" font-size="13" text-anchor="middle" fill="#302828">tracking dressed as service</text>

  <rect x="860" y="280" width="320" height="100" rx="18" fill="#bfe6c9"/>
  <text x="1020" y="318" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">Consent and choice</text>
  <text x="1020" y="344" font-size="13" text-anchor="middle" fill="#302828">agreement without freedom</text>

  <rect x="860" y="440" width="320" height="100" rx="18" fill="#d3c3f2"/>
  <text x="1020" y="478" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">Data as power</text>
  <text x="1020" y="504" font-size="13" text-anchor="middle" fill="#302828">toxic asset, uranium age</text>

  <!-- hub -->
  <rect x="470" y="255" width="300" height="120" rx="20" fill="#302828"/>
  <text x="620" y="300" font-size="19" font-weight="900" text-anchor="middle" fill="#f7f2e8">DOING THE</text>
  <text x="620" y="328" font-size="19" font-weight="900" text-anchor="middle" fill="#f7f2e8">RIGHT THING</text>
  <text x="620" y="354" font-size="13" text-anchor="middle" fill="#ffcfb8">engineer is responsible</text>

  <!-- bottom satellite -->
  <rect x="470" y="505" width="300" height="88" rx="18" fill="#ffe08a"/>
  <text x="620" y="541" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">Law and self-restraint</text>
  <text x="620" y="567" font-size="13" text-anchor="middle" fill="#302828">minimize, purge, reform</text>

  <!-- edge labels -->
  <text x="425" y="222" font-size="13" font-weight="800" text-anchor="middle" fill="#6e665c">scores</text>
  <text x="425" y="322" font-size="13" font-weight="800" text-anchor="middle" fill="#6e665c">launders</text>
  <text x="425" y="438" font-size="13" font-weight="800" text-anchor="middle" fill="#6e665c">amplifies</text>
  <text x="815" y="222" font-size="13" font-weight="800" text-anchor="middle" fill="#6e665c">watches</text>
  <text x="815" y="322" font-size="13" font-weight="800" text-anchor="middle" fill="#6e665c">asks?</text>
  <text x="815" y="438" font-size="13" font-weight="800" text-anchor="middle" fill="#6e665c">controls</text>
  <text x="648" y="448" font-size="13" font-weight="800" text-anchor="start" fill="#6e665c">responds</text>

  <text x="620" y="636" font-size="13" text-anchor="middle" fill="#6e665c">read the arrows: each concept is one way a data system touches human lives</text>
</svg>
</div>
</body>
</html>
