<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remembering the Industrial Revolution — Two Eras, One Pattern</title>
<style>
  html,body{margin:0;background:#0b111c;color:#e8edf7;
    font-family:'Vazirmatn',system-ui,sans-serif;}
  .stage{width:100%; display:flex; justify-content:center; padding:10px 0;}
  svg{width:100%; height:auto; max-width:1240px;}
  .ttl{font:700 19px system-ui,sans-serif; fill:#5eead4}
  .sub{font:13px system-ui,sans-serif; fill:#a7b3cc}
  .lane{font:700 13px ui-monospace,Menlo,monospace; fill:#93c5fd}
  .band-h{font:700 13px system-ui,sans-serif; fill:#93c5fd}
  .quote{font:italic 13px system-ui,sans-serif; fill:#e8edf7}
  .box-h{font:700 12.5px ui-monospace,Menlo,monospace; fill:#0b111c}
  .box-t{font:12.5px ui-monospace,Menlo,monospace; fill:#e8edf7}
  .edge-lbl{font:700 12px ui-monospace,Menlo,monospace; fill:#86efac}
  .time-lbl{font:700 11.5px ui-monospace,Menlo,monospace; fill:#a7b3cc}
  .note{font:12.5px system-ui,sans-serif; fill:#cfe3ff}
  .note-h{font:700 13px system-ui,sans-serif; fill:#fbbf24}
  .small{font:11.5px ui-monospace,Menlo,monospace; fill:#a7b3cc}
  .foot{font:700 13px system-ui,sans-serif; fill:#fbbf24}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1240 660" role="img" aria-label="Two-lane timeline comparing the Industrial Revolution and the Information Age: growth, dark side, then safeguards, with the Schneier data-as-pollution quote between the lanes">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#86efac"/>
    </marker>
  </defs>

  <text class="ttl" x="620" y="32" text-anchor="middle">Remembering the Industrial Revolution</text>
  <text class="sub" x="620" y="54" text-anchor="middle">the information age replays an old pattern: growth, dark side, then safeguards</text>

  <!-- ================= ERA 1 ================= -->
  <rect x="40" y="68" width="1160" height="168" rx="10" fill="#161d2e" stroke="#2a3652" stroke-width="1.4"/>
  <text class="lane" x="58" y="92">ERA 1 · INDUSTRIAL REVOLUTION</text>

  <rect x="190" y="104" width="280" height="100" rx="8" fill="#0e2a33" stroke="#5eead4" stroke-width="1.4"/>
  <text class="box-h" x="205" y="128" fill="#5eead4" style="fill:#5eead4">GROWTH</text>
  <text class="box-t" x="205" y="150">technology advances</text>
  <text class="box-t" x="205" y="170">agricultural surplus</text>
  <text class="box-t" x="205" y="190">urbanization</text>

  <line x1="472" y1="154" x2="501" y2="154" stroke="#86efac" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="505" y="104" width="280" height="100" rx="8" fill="#33141f" stroke="#fda4af" stroke-width="1.4"/>
  <text class="box-h" x="520" y="128" style="fill:#fda4af">DARK SIDE</text>
  <text class="box-t" x="520" y="150">air + water pollution</text>
  <text class="box-t" x="520" y="170">squalor, disease</text>
  <text class="box-t" x="520" y="190">child labor</text>

  <line x1="787" y1="154" x2="816" y2="154" stroke="#86efac" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="820" y="104" width="340" height="100" rx="8" fill="#0f2b1f" stroke="#86efac" stroke-width="1.4"/>
  <text class="box-h" x="835" y="128" style="fill:#86efac">SAFEGUARDS</text>
  <text class="box-t" x="835" y="150">environmental protection</text>
  <text class="box-t" x="835" y="170">workplace safety laws</text>
  <text class="box-t" x="835" y="190">child-labor + food laws</text>

  <line x1="330" y1="224" x2="990" y2="224" stroke="#3b4a6b" stroke-width="1.6"/>
  <circle cx="330" cy="224" r="6" fill="#5eead4" stroke="#0b111c" stroke-width="2"/>
  <circle cx="645" cy="224" r="6" fill="#fda4af" stroke="#0b111c" stroke-width="2"/>
  <circle cx="990" cy="224" r="6" fill="#86efac" stroke="#0b111c" stroke-width="2"/>
  <text class="time-lbl" x="1140" y="228" text-anchor="end">time →</text>

  <!-- ================= QUOTE BAND ================= -->
  <rect x="40" y="246" width="1160" height="96" rx="10" fill="#1b2438" stroke="#93c5fd" stroke-width="1.4"/>
  <text class="band-h" x="620" y="270" text-anchor="middle">BRUCE SCHNEIER · DATA AS POLLUTION</text>
  <text class="quote" x="620" y="294" text-anchor="middle">“Data is the pollution problem of the information age,</text>
  <text class="quote" x="620" y="314" text-anchor="middle">and protecting privacy is the environmental challenge.”</text>

  <!-- ================= ERA 2 ================= -->
  <rect x="40" y="352" width="1160" height="158" rx="10" fill="#161d2e" stroke="#2a3652" stroke-width="1.4"/>
  <text class="lane" x="58" y="376">ERA 2 · INFORMATION AGE</text>

  <rect x="190" y="388" width="280" height="96" rx="8" fill="#0e2a33" stroke="#5eead4" stroke-width="1.4"/>
  <text class="box-h" x="205" y="410" style="fill:#5eead4">GROWTH</text>
  <text class="box-t" x="205" y="432">internet scale</text>
  <text class="box-t" x="205" y="452">cheap storage</text>
  <text class="box-t" x="205" y="472">automation</text>

  <line x1="472" y1="436" x2="501" y2="436" stroke="#86efac" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="505" y="388" width="280" height="96" rx="8" fill="#33141f" stroke="#fda4af" stroke-width="1.4"/>
  <text class="box-h" x="520" y="410" style="fill:#fda4af">DARK SIDE</text>
  <text class="box-t" x="520" y="432">mass data extraction</text>
  <text class="box-t" x="520" y="452">surveillance</text>
  <text class="box-t" x="520" y="472">discrimination</text>

  <line x1="787" y1="436" x2="816" y2="436" stroke="#86efac" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="820" y="388" width="340" height="96" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text class="box-h" x="835" y="410" style="fill:#fbbf24">SAFEGUARDS NEEDED</text>
  <text class="box-t" x="835" y="432">minimization, retention limits</text>
  <text class="box-t" x="835" y="452">GDPR-style consent</text>
  <text class="box-t" x="835" y="472">culture shift</text>

  <line x1="330" y1="498" x2="990" y2="498" stroke="#3b4a6b" stroke-width="1.6"/>
  <circle cx="330" cy="498" r="6" fill="#5eead4" stroke="#0b111c" stroke-width="2"/>
  <circle cx="645" cy="498" r="6" fill="#fda4af" stroke="#0b111c" stroke-width="2"/>
  <circle cx="990" cy="498" r="6" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 2"/>
  <text class="time-lbl" x="1140" y="502" text-anchor="end">time →</text>

  <!-- ================= FOOTER ================= -->
  <rect x="40" y="522" width="1160" height="100" rx="10" fill="#1b2438" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="6 4"/>
  <circle cx="70" cy="546" r="6" fill="#5eead4" stroke="#0b111c" stroke-width="2"/>
  <text class="small" x="84" y="550">growth</text>
  <circle cx="180" cy="546" r="6" fill="#fda4af" stroke="#0b111c" stroke-width="2"/>
  <text class="small" x="194" y="550">dark side</text>
  <circle cx="310" cy="546" r="6" fill="#86efac" stroke="#0b111c" stroke-width="2"/>
  <text class="small" x="324" y="550">safeguards</text>
  <line x1="470" y1="546" x2="510" y2="546" stroke="#86efac" stroke-width="1.8" marker-end="url(#arr)"/>
  <text class="small" x="518" y="550">sequence</text>
  <circle cx="640" cy="546" r="6" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 2"/>
  <text class="small" x="654" y="550">not yet won (dashed)</text>
  <text class="foot" x="620" y="582" text-anchor="middle">growth concentrates power → harms surface → society demands safeguards</text>
  <text class="note" x="620" y="604" text-anchor="middle">the information age is still negotiating its safeguards</text>
</svg>
</div>
</body>
</html>
