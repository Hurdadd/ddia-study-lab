<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consent Spectrum — from genuine consent to surveillance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f7f2e8;display:flex;justify-content:center;padding:16px;font-family:'Nunito',system-ui,sans-serif}
  .stage{width:100%;max-width:1280px}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Consent spectrum diagram">
  <title>Consent spectrum: from genuine consent to surveillance</title>
  <rect x="0" y="0" width="1240" height="660" rx="24" fill="#f7f2e8"/>
  <text x="620" y="52" font-size="27" font-weight="900" text-anchor="middle" fill="#302828">The Consent Spectrum: From Agency to Surveillance</text>
  <text x="620" y="86" font-size="15" text-anchor="middle" fill="#6e665c">the same click means very different things — only the left end is meaningful consent</text>

  <text x="52" y="128" font-size="13" font-weight="800" fill="#2e7d54">MORE AGENCY</text>
  <text x="1188" y="128" font-size="13" font-weight="800" text-anchor="end" fill="#c2437f">LESS AGENCY</text>
  <line x1="52" y1="140" x2="1188" y2="140" stroke="#9b9184" stroke-width="3" stroke-linecap="round"/>
  <polygon points="1188,132 1204,140 1188,148" fill="#9b9184"/>

  <!-- card 1 -->
  <rect x="52" y="162" width="208" height="290" rx="18" fill="#bfe6c9"/>
  <text x="156" y="202" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">Genuine consent</text>
  <text x="156" y="232" font-size="13" text-anchor="middle" fill="#302828">free and informed</text>
  <text x="156" y="256" font-size="13" text-anchor="middle" fill="#302828">specific purpose</text>
  <text x="156" y="280" font-size="13" text-anchor="middle" fill="#302828">refuse has no cost</text>
  <text x="156" y="304" font-size="13" text-anchor="middle" fill="#302828">withdraw any time</text>
  <rect x="76" y="330" width="160" height="34" rx="17" fill="#302828"/>
  <text x="156" y="353" font-size="13" font-weight="800" text-anchor="middle" fill="#f7f2e8">VALID CONSENT</text>
  <text x="156" y="410" font-size="13" text-anchor="middle" fill="#302828">rare in practice</text>

  <!-- card 2 -->
  <rect x="284" y="162" width="208" height="290" rx="18" fill="#ffe08a"/>
  <text x="388" y="202" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">Informed opt-in</text>
  <text x="388" y="232" font-size="13" text-anchor="middle" fill="#302828">plain-language notice</text>
  <text x="388" y="256" font-size="13" text-anchor="middle" fill="#302828">user picks a level</text>
  <text x="388" y="280" font-size="13" text-anchor="middle" fill="#302828">new purpose: re-ask</text>
  <text x="388" y="304" font-size="13" text-anchor="middle" fill="#302828">settings respected</text>
  <rect x="308" y="330" width="160" height="34" rx="17" fill="#302828"/>
  <text x="388" y="353" font-size="13" font-weight="800" text-anchor="middle" fill="#f7f2e8">VALID IF HONEST</text>
  <text x="388" y="410" font-size="13" text-anchor="middle" fill="#302828">needs real choice</text>

  <!-- card 3 -->
  <rect x="516" y="162" width="208" height="290" rx="18" fill="#ffcfb8"/>
  <text x="620" y="202" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">Take-it-or-leave-it</text>
  <text x="620" y="232" font-size="13" text-anchor="middle" fill="#302828">bundled with service</text>
  <text x="620" y="256" font-size="13" text-anchor="middle" fill="#302828">refuse means no access</text>
  <text x="620" y="280" font-size="13" text-anchor="middle" fill="#302828">service feels mandatory</text>
  <text x="620" y="304" font-size="13" text-anchor="middle" fill="#302828">social cost to quit</text>
  <rect x="540" y="330" width="160" height="34" rx="17" fill="#d95f33"/>
  <text x="620" y="353" font-size="13" font-weight="800" text-anchor="middle" fill="#fffdf7">NOT FREE: INVALID</text>
  <text x="620" y="410" font-size="13" text-anchor="middle" fill="#302828">most common pattern</text>

  <!-- card 4 -->
  <rect x="748" y="162" width="208" height="290" rx="18" fill="#ffc2da"/>
  <text x="852" y="202" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">Dark patterns</text>
  <text x="852" y="232" font-size="13" text-anchor="middle" fill="#302828">pre-ticked boxes</text>
  <text x="852" y="256" font-size="13" text-anchor="middle" fill="#302828">hidden settings</text>
  <text x="852" y="280" font-size="13" text-anchor="middle" fill="#302828">nagging pop-ups</text>
  <text x="852" y="304" font-size="13" text-anchor="middle" fill="#302828">silence means yes</text>
  <rect x="772" y="330" width="160" height="34" rx="17" fill="#c2437f"/>
  <text x="852" y="353" font-size="13" font-weight="800" text-anchor="middle" fill="#fffdf7">NOT CONSENT</text>
  <text x="852" y="410" font-size="13" text-anchor="middle" fill="#302828">manufactured yes</text>

  <!-- card 5 -->
  <rect x="980" y="162" width="208" height="290" rx="18" fill="#d3c3f2"/>
  <text x="1084" y="202" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">No choice at all</text>
  <text x="1084" y="232" font-size="13" text-anchor="middle" fill="#302828">tracked by default</text>
  <text x="1084" y="256" font-size="13" text-anchor="middle" fill="#302828">third-party data</text>
  <text x="1084" y="280" font-size="13" text-anchor="middle" fill="#302828">non-users profiled</text>
  <text x="1084" y="304" font-size="13" text-anchor="middle" fill="#302828">opt-out is fiction</text>
  <rect x="1004" y="330" width="160" height="34" rx="17" fill="#302828"/>
  <text x="1084" y="353" font-size="13" font-weight="800" text-anchor="middle" fill="#f7f2e8">SURVEILLANCE</text>
  <text x="1084" y="410" font-size="13" text-anchor="middle" fill="#302828">call it what it is</text>

  <!-- arrows between cards -->
  <polygon points="268,300 284,290 284,310" fill="#9b9184"/>
  <polygon points="500,300 516,290 516,310" fill="#9b9184"/>
  <polygon points="732,300 748,290 748,310" fill="#9b9184"/>
  <polygon points="964,300 980,290 980,310" fill="#9b9184"/>

  <!-- GDPR strip -->
  <rect x="52" y="478" width="1136" height="150" rx="18" fill="#fffdf7"/>
  <text x="620" y="514" font-size="16" font-weight="900" text-anchor="middle" fill="#302828">GDPR test: consent is valid only if ALL five hold</text>
  <rect x="82" y="532" width="196" height="62" rx="16" fill="#bfe6c9"/>
  <text x="180" y="558" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Freely given</text>
  <text x="180" y="580" font-size="13" text-anchor="middle" fill="#302828">no penalty for no</text>
  <rect x="292" y="532" width="196" height="62" rx="16" fill="#ffe08a"/>
  <text x="390" y="558" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Specific</text>
  <text x="390" y="580" font-size="13" text-anchor="middle" fill="#302828">per purpose, not blanket</text>
  <rect x="502" y="532" width="196" height="62" rx="16" fill="#c3ceff"/>
  <text x="600" y="558" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Informed</text>
  <text x="600" y="580" font-size="13" text-anchor="middle" fill="#302828">plain, clear language</text>
  <rect x="712" y="532" width="196" height="62" rx="16" fill="#ffcfb8"/>
  <text x="810" y="558" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Unambiguous</text>
  <text x="810" y="580" font-size="13" text-anchor="middle" fill="#302828">silence is not yes</text>
  <rect x="922" y="532" width="196" height="62" rx="16" fill="#ffc2da"/>
  <text x="1020" y="558" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Withdrawable</text>
  <text x="1020" y="580" font-size="13" text-anchor="middle" fill="#302828">leave without harm</text>
</svg>
</div>
</body>
</html>
