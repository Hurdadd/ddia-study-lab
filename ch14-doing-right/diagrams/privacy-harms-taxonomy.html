<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy harms taxonomy — where things go wrong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f7f2e8;display:flex;justify-content:center;padding:16px;font-family:'Nunito',system-ui,sans-serif}
  .stage{width:100%;max-width:1280px}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Privacy harms taxonomy diagram">
  <title>Privacy harms taxonomy: collection, processing, dissemination, invasion</title>
  <rect x="0" y="0" width="1240" height="660" rx="24" fill="#f7f2e8"/>
  <text x="620" y="52" font-size="27" font-weight="900" text-anchor="middle" fill="#302828">Privacy Harms: A Taxonomy of Where Things Go Wrong</text>
  <text x="620" y="86" font-size="15" text-anchor="middle" fill="#6e665c">four families of harm, in the order data flows through a system</text>

  <line x1="50" y1="118" x2="1190" y2="118" stroke="#9b9184" stroke-width="3" stroke-linecap="round"/>
  <polygon points="1190,110 1206,118 1190,126" fill="#9b9184"/>
  <text x="50" y="108" font-size="13" font-weight="800" fill="#6e665c">DATA FLOWS THIS WAY</text>

  <!-- column 1: collection -->
  <rect x="50" y="140" width="265" height="470" rx="18" fill="#bfe6c9"/>
  <text x="182" y="180" font-size="17" font-weight="900" text-anchor="middle" fill="#302828">1. Collection</text>
  <text x="182" y="204" font-size="13" text-anchor="middle" fill="#302828">watching and asking</text>
  <rect x="70" y="222" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="182" y="247" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Surveillance</text>
  <text x="182" y="267" font-size="13" text-anchor="middle" fill="#302828">always-on tracking</text>
  <rect x="70" y="290" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="182" y="315" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Interrogation</text>
  <text x="182" y="335" font-size="13" text-anchor="middle" fill="#302828">forced questionnaires</text>
  <rect x="70" y="358" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="182" y="383" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Insecurity</text>
  <text x="182" y="403" font-size="13" text-anchor="middle" fill="#302828">careless storage</text>
  <rect x="70" y="426" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="182" y="451" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Over-collection</text>
  <text x="182" y="471" font-size="13" text-anchor="middle" fill="#302828">grab everything</text>
  <text x="182" y="530" font-size="13" font-weight="800" text-anchor="middle" fill="#302828">fix: minimize at source</text>
  <text x="182" y="556" font-size="13" text-anchor="middle" fill="#302828">collect only what serves</text>
  <text x="182" y="582" font-size="13" text-anchor="middle" fill="#302828">the stated purpose</text>

  <!-- column 2: processing -->
  <rect x="335" y="140" width="265" height="470" rx="18" fill="#ffe08a"/>
  <text x="467" y="180" font-size="17" font-weight="900" text-anchor="middle" fill="#302828">2. Processing</text>
  <text x="467" y="204" font-size="13" text-anchor="middle" fill="#302828">combining and scoring</text>
  <rect x="355" y="222" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="467" y="247" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Aggregation</text>
  <text x="467" y="267" font-size="13" text-anchor="middle" fill="#302828">mosaic from pieces</text>
  <rect x="355" y="290" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="467" y="315" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Re-identification</text>
  <text x="467" y="335" font-size="13" text-anchor="middle" fill="#302828">re-linking the anonymous</text>
  <rect x="355" y="358" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="467" y="383" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Secondary use</text>
  <text x="467" y="403" font-size="13" text-anchor="middle" fill="#302828">new purpose, no re-ask</text>
  <rect x="355" y="426" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="467" y="451" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Exclusion</text>
  <text x="467" y="471" font-size="13" text-anchor="middle" fill="#302828">no say, no appeal</text>
  <text x="467" y="530" font-size="13" font-weight="800" text-anchor="middle" fill="#302828">fix: purpose limits</text>
  <text x="467" y="556" font-size="13" text-anchor="middle" fill="#302828">retention caps, real</text>
  <text x="467" y="582" font-size="13" text-anchor="middle" fill="#302828">deletion on withdrawal</text>

  <!-- column 3: dissemination -->
  <rect x="620" y="140" width="265" height="470" rx="18" fill="#ffc2da"/>
  <text x="752" y="180" font-size="17" font-weight="900" text-anchor="middle" fill="#302828">3. Dissemination</text>
  <text x="752" y="204" font-size="13" text-anchor="middle" fill="#302828">spreading it around</text>
  <rect x="640" y="222" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="752" y="247" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Disclosure</text>
  <text x="752" y="267" font-size="13" text-anchor="middle" fill="#302828">true facts revealed</text>
  <rect x="640" y="290" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="752" y="315" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Exposure</text>
  <text x="752" y="335" font-size="13" text-anchor="middle" fill="#302828">intimate life laid bare</text>
  <rect x="640" y="358" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="752" y="383" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Blackmail</text>
  <text x="752" y="403" font-size="13" text-anchor="middle" fill="#302828">leverage over victims</text>
  <rect x="640" y="426" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="752" y="451" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Distortion</text>
  <text x="752" y="471" font-size="13" text-anchor="middle" fill="#302828">false, unfair portrait</text>
  <text x="752" y="530" font-size="13" font-weight="800" text-anchor="middle" fill="#302828">fix: breach discipline</text>
  <text x="752" y="556" font-size="13" text-anchor="middle" fill="#302828">access control, audit,</text>
  <text x="752" y="582" font-size="13" text-anchor="middle" fill="#302828">no silent sharing</text>

  <!-- column 4: invasion -->
  <rect x="905" y="140" width="265" height="470" rx="18" fill="#c3ceff"/>
  <text x="1037" y="180" font-size="17" font-weight="900" text-anchor="middle" fill="#302828">4. Invasion</text>
  <text x="1037" y="204" font-size="13" text-anchor="middle" fill="#302828">intruding on the person</text>
  <rect x="925" y="222" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="1037" y="247" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Intrusion</text>
  <text x="1037" y="267" font-size="13" text-anchor="middle" fill="#302828">unwanted watching</text>
  <rect x="925" y="290" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="1037" y="315" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Decisional push</text>
  <text x="1037" y="335" font-size="13" text-anchor="middle" fill="#302828">nudged, scored, filtered</text>
  <rect x="925" y="358" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="1037" y="383" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Exclusion spiral</text>
  <text x="1037" y="403" font-size="13" text-anchor="middle" fill="#302828">score locks doors</text>
  <rect x="925" y="426" width="225" height="56" rx="16" fill="#fffdf7"/>
  <text x="1037" y="451" font-size="14" font-weight="800" text-anchor="middle" fill="#302828">Chilling effect</text>
  <text x="1037" y="471" font-size="13" text-anchor="middle" fill="#302828">self-censorship</text>
  <text x="1037" y="530" font-size="13" font-weight="800" text-anchor="middle" fill="#302828">fix: appeal paths</text>
  <text x="1037" y="556" font-size="13" text-anchor="middle" fill="#302828">human review, opt-outs</text>
  <text x="1037" y="582" font-size="13" text-anchor="middle" fill="#302828">that actually work</text>

  <polygon points="323,360 335,350 335,370" fill="#9b9184"/>
  <polygon points="608,360 620,350 620,370" fill="#9b9184"/>
  <polygon points="893,360 905,350 905,370" fill="#9b9184"/>
  <text x="620" y="642" font-size="13" text-anchor="middle" fill="#6e665c">harms compound left to right: collected once, processed many times, spread widely, felt personally</text>
</svg>
</div>
</body>
</html>
