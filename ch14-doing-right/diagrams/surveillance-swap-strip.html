<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try Replacing the Word Data with Surveillance</title>
<style>
  html,body{margin:0;background:#0b111c;color:#e8edf7;
    font-family:'Vazirmatn',system-ui,sans-serif;}
  .stage{width:100%; display:flex; justify-content:center; padding:10px 0;}
  svg{width:100%; height:auto; max-width:1240px;}
  .ttl{font:700 19px system-ui,sans-serif; fill:#5eead4}
  .sub{font:13px system-ui,sans-serif; fill:#a7b3cc}
  .bh{font:700 14px system-ui,sans-serif; fill:#5eead4}
  .bh2{font:700 14px system-ui,sans-serif; fill:#fda4af}
  .bhs{font:12px system-ui,sans-serif; fill:#a7b3cc}
  .sen{font:12.5px ui-monospace,Menlo,monospace; fill:#cfe3ff}
  .hl{font-weight:700; fill:#5eead4}
  .hlr{font-weight:700; fill:#fda4af}
  .tag{font:700 12px ui-monospace,Menlo,monospace; fill:#0b111c}
  .swap-t{font:700 13px ui-monospace,Menlo,monospace; fill:#fbbf24}
  .q{font:700 14px system-ui,sans-serif; fill:#fbbf24}
  .qs{font:13px system-ui,sans-serif; fill:#e8edf7}
  .small{font:11.5px ui-monospace,Menlo,monospace; fill:#a7b3cc}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1240 660" role="img" aria-label="Three jargon sentences with the word data highlighted, then the same sentences with surveillance swapped in reading ominously, ending with a punchline about surveillance-intensive applications">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <text class="ttl" x="620" y="32" text-anchor="middle">Try Replacing the Word Data with Surveillance</text>
  <text class="sub" x="620" y="54" text-anchor="middle">the industry jargon sounds neutral — the swap tests whether it should</text>

  <!-- ============ TOP BAND: the D-word ============ -->
  <rect x="40" y="80" width="1160" height="222" rx="10" fill="#161d2e" stroke="#2a3652" stroke-width="1.4"/>
  <text class="bh" x="70" y="108">how vendors describe it — the D-word</text>
  <text class="bhs" x="70" y="128">neutral · technical · fundable — nothing to fear</text>

  <rect x="62" y="148" width="36" height="24" rx="6" fill="#5eead4"/>
  <text class="tag" x="80" y="165" text-anchor="middle">S1</text>
  <text class="sen" x="110" y="165">In our <tspan class="hl">data-driven</tspan> organization we collect real-time <tspan class="hl">data</tspan> streams</text>

  <rect x="62" y="193" width="36" height="24" rx="6" fill="#5eead4"/>
  <text class="tag" x="80" y="210" text-anchor="middle">S2</text>
  <text class="sen" x="110" y="210">We store them in our <tspan class="hl">data warehouse</tspan> for instant <tspan class="hl">data</tspan> access</text>

  <rect x="62" y="238" width="36" height="24" rx="6" fill="#5eead4"/>
  <text class="tag" x="80" y="255" text-anchor="middle">S3</text>
  <text class="sen" x="110" y="255">Our <tspan class="hl">data scientists</tspan> use advanced analytics and <tspan class="hl">data processing</tspan> at scale</text>
  <text class="small" x="70" y="286">funding slides love these sentences — nobody flinches</text>

  <!-- ============ swap chip ============ -->
  <rect x="452" y="310" width="336" height="36" rx="10" fill="#1b2438" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="swap-t" x="620" y="333" text-anchor="middle">replace data with surveillance ↓</text>

  <!-- ============ BOTTOM BAND: the S-word ============ -->
  <rect x="40" y="360" width="1160" height="180" rx="10" fill="#1c1420" stroke="#f43f5e" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text class="bh2" x="70" y="388">after the swap — the same three sentences</text>
  <text class="bhs" x="70" y="406">ominous · creepy · hard to fund — now question the system</text>

  <rect x="62" y="418" width="36" height="24" rx="6" fill="#f43f5e"/>
  <text class="tag" x="80" y="435" text-anchor="middle">S1</text>
  <text class="sen" x="110" y="435">In our <tspan class="hlr">surveillance-driven</tspan> organization we collect real-time <tspan class="hlr">surveillance</tspan> streams</text>

  <rect x="62" y="452" width="36" height="24" rx="6" fill="#f43f5e"/>
  <text class="tag" x="80" y="469" text-anchor="middle">S2</text>
  <text class="sen" x="110" y="469">We store them in our <tspan class="hlr">surveillance warehouse</tspan> for instant <tspan class="hlr">surveillance</tspan> access</text>

  <rect x="62" y="486" width="36" height="24" rx="6" fill="#f43f5e"/>
  <text class="tag" x="80" y="503" text-anchor="middle">S3</text>
  <text class="sen" x="110" y="503">Our <tspan class="hlr">surveillance scientists</tspan> use advanced analytics and <tspan class="hlr">surveillance processing</tspan> at scale</text>
  <text class="small" x="70" y="528">same infrastructure — suddenly it reads like a warning label</text>

  <!-- ============ punchline footer ============ -->
  <rect x="40" y="552" width="1160" height="72" rx="10" fill="#1b2438" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="q" x="620" y="580" text-anchor="middle">Designing Surveillance-Intensive Applications</text>
  <text class="qs" x="620" y="602" text-anchor="middle">strong words for mass surveillance infrastructure — if the swap sounds creepy, question the system, not the word</text>
</svg>
</div>
</body>
</html>
