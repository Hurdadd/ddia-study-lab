<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethics Is Not a Checklist — Linear Box-Ticking vs Participatory Loop</title>
<style>
  html,body{margin:0;background:#0b111c;color:#e8edf7;
    font-family:'Vazirmatn',system-ui,sans-serif;}
  .stage{width:100%; display:flex; justify-content:center; padding:10px 0;}
  svg{width:100%; height:auto; max-width:1240px;}
  .ttl{font:700 19px system-ui,sans-serif; fill:#5eead4}
  .sub{font:13px system-ui,sans-serif; fill:#a7b3cc}
  .p-head-bad{font:700 12px ui-monospace,Menlo,monospace; fill:#fda4af}
  .p-title-bad{font:700 15px system-ui,sans-serif; fill:#fda4af}
  .p-head-good{font:700 12px ui-monospace,Menlo,monospace; fill:#86efac}
  .p-title-good{font:700 15px system-ui,sans-serif; fill:#5eead4}
  .step-t{font:700 12.5px ui-monospace,Menlo,monospace; fill:#8b96ad}
  .dim-t{font:12.5px ui-monospace,Menlo,monospace; fill:#8b96ad}
  .verdict{font:700 12.5px ui-monospace,Menlo,monospace; fill:#fda4af}
  .loop-t{font:700 12.5px ui-monospace,Menlo,monospace; fill:#e8edf7}
  .loop-t-sm{font:700 12px ui-monospace,Menlo,monospace; fill:#e8edf7}
  .guide{font:12.5px ui-monospace,Menlo,monospace; fill:#cfe3ff}
  .repeat{font:700 14px ui-monospace,Menlo,monospace; fill:#fbbf24}
  .repeat-s{font:11.5px ui-monospace,Menlo,monospace; fill:#a7b3cc}
  .edge-lbl{font:700 12px ui-monospace,Menlo,monospace; fill:#86efac}
  .note{font:12.5px system-ui,sans-serif; fill:#cfe3ff}
  .foot{font:700 13px system-ui,sans-serif; fill:#fbbf24}
  .small{font:11.5px ui-monospace,Menlo,monospace; fill:#a7b3cc}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1240 660" role="img" aria-label="Contrast between checklist compliance, a dimmed linear chain of collect data, tick compliance box, ship, and the highlighted participatory loop of reflect, dialogue, act, and accountability that repeats">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#86efac"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b657d"/>
    </marker>
  </defs>

  <text class="ttl" x="620" y="32" text-anchor="middle">Ethics Is Not a Checklist</text>
  <text class="sub" x="620" y="54" text-anchor="middle">reflect, talk to the people affected, adjust — then do it again</text>

  <!-- ================= LEFT: ANTI-PATTERN ================= -->
  <rect x="40" y="70" width="520" height="440" rx="10" fill="#141b2c" stroke="#3b4a6b" stroke-width="1.4"/>
  <text class="p-head-bad" x="60" y="96">ANTI-PATTERN · DIMMED</text>
  <text class="p-title-bad" x="60" y="120">checklist compliance</text>

  <rect x="140" y="140" width="320" height="44" rx="8" fill="#1a2233" stroke="#3b4a6b" stroke-width="1.4"/>
  <text class="step-t" x="300" y="167" text-anchor="middle">1 · collect data</text>
  <line x1="300" y1="186" x2="300" y2="204" stroke="#5b657d" stroke-width="1.8" marker-end="url(#arrd)"/>

  <rect x="140" y="206" width="320" height="44" rx="8" fill="#1a2233" stroke="#3b4a6b" stroke-width="1.4"/>
  <text class="step-t" x="300" y="233" text-anchor="middle">2 · tick compliance box</text>
  <line x1="300" y1="252" x2="300" y2="270" stroke="#5b657d" stroke-width="1.8" marker-end="url(#arrd)"/>

  <rect x="140" y="272" width="320" height="44" rx="8" fill="#1a2233" stroke="#3b4a6b" stroke-width="1.4"/>
  <text class="step-t" x="300" y="299" text-anchor="middle">3 · ship</text>

  <text class="verdict" x="300" y="352" text-anchor="middle">✗ ships harm downstream</text>
  <text class="dim-t" x="300" y="376" text-anchor="middle">ethics theatre, not safety</text>
  <text class="dim-t" x="300" y="414" text-anchor="middle">the harmed are never consulted</text>
  <text class="dim-t" x="300" y="438" text-anchor="middle">the box is ticked once, never revisited</text>
  <text class="dim-t" x="300" y="474" text-anchor="middle">harm ships with a stamp on it</text>

  <line x1="62" y1="132" x2="538" y2="488" stroke="#f43f5e" stroke-width="3" opacity="0.35"/>
  <line x1="538" y1="132" x2="62" y2="488" stroke="#f43f5e" stroke-width="3" opacity="0.35"/>

  <!-- ================= RIGHT: PARTICIPATORY LOOP ================= -->
  <rect x="640" y="70" width="560" height="440" rx="10" fill="#161d2e" stroke="#86efac" stroke-width="1.6"/>
  <text class="p-head-good" x="660" y="96">THE ALTERNATIVE · HIGHLIGHTED</text>
  <text class="p-title-good" x="660" y="120">participatory loop</text>
  <text class="guide" x="920" y="148" text-anchor="middle">guide: ACM Code of Ethics</text>

  <rect x="815" y="164" width="210" height="40" rx="8" fill="#0e2a26" stroke="#5eead4" stroke-width="1.4"/>
  <text class="loop-t" x="920" y="189" text-anchor="middle">reflect on consequences</text>

  <rect x="660" y="254" width="190" height="56" rx="8" fill="#0e2a26" stroke="#5eead4" stroke-width="1.4"/>
  <text class="loop-t-sm" x="755" y="277" text-anchor="middle">accountability</text>
  <text class="loop-t-sm" x="755" y="296" text-anchor="middle">for results</text>

  <rect x="970" y="254" width="190" height="56" rx="8" fill="#0e2a26" stroke="#5eead4" stroke-width="1.4"/>
  <text class="loop-t-sm" x="1065" y="277" text-anchor="middle">dialogue with</text>
  <text class="loop-t-sm" x="1065" y="296" text-anchor="middle">affected people</text>

  <rect x="815" y="362" width="210" height="40" rx="8" fill="#0e2a26" stroke="#5eead4" stroke-width="1.4"/>
  <text class="loop-t" x="920" y="387" text-anchor="middle">act / adjust</text>

  <line x1="1027" y1="206" x2="1061" y2="252" stroke="#86efac" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="1067" y1="312" x2="1031" y2="360" stroke="#86efac" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="813" y1="382" x2="759" y2="312" stroke="#86efac" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="759" y1="252" x2="813" y2="202" stroke="#86efac" stroke-width="1.8" marker-end="url(#arr)"/>

  <text class="repeat" x="920" y="292" text-anchor="middle">repeat</text>
  <text class="repeat-s" x="920" y="328" text-anchor="middle">the loop never closes</text>

  <text class="note" x="920" y="442" text-anchor="middle">every pass re-asks: who is harmed?</text>
  <text class="note" x="920" y="466" text-anchor="middle">adjust, then account for results</text>

  <!-- ================= FOOTER ================= -->
  <rect x="40" y="522" width="1160" height="100" rx="10" fill="#1b2438" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="foot" x="620" y="556" text-anchor="middle">Ethics is a participatory, iterative process — not going through a checklist</text>
  <text class="note" x="620" y="580" text-anchor="middle">consult the affected, revisit often, own the outcomes</text>
  <text class="small" x="620" y="604" text-anchor="middle">left: linear, once-through · right: cyclic, revisited</text>
</svg>
</div>
</body>
</html>
