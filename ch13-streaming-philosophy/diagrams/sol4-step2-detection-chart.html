<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cost grows, proof does not — DDIA Chapter 13 Solution 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&amp;family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Bar chart of checker cost versus detection power plus two blind spots">
<title>Checker cost versus detection power and blind spots</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#302828"/>
</marker>
</defs>
<text x="620" y="52" font-size="30" font-weight="900" text-anchor="middle">Cost grows left to right; proof does not</text>
<text x="620" y="86" font-size="16" text-anchor="middle">each check buys a detection, and every check has a blind spot</text>
<text x="40" y="122" font-size="14" text-anchor="start">checks, cheapest first:</text>
<text x="40" y="164" font-size="15" font-weight="800" text-anchor="start">lag board</text>
<rect x="380" y="140" width="120" height="36" rx="10" fill="#bfe6c9"/>
<text x="512" y="164" font-size="14" text-anchor="start">catches lag in minutes</text>
<text x="40" y="254" font-size="15" font-weight="800" text-anchor="start">checkpoint replay</text>
<rect x="380" y="230" width="260" height="36" rx="10" fill="#c3ceff"/>
<text x="652" y="254" font-size="14" text-anchor="start">catches silent drops, hourly</text>
<text x="40" y="344" font-size="15" font-weight="800" text-anchor="start">totals sum-check</text>
<rect x="380" y="320" width="380" height="36" rx="10" fill="#ffe08a"/>
<text x="772" y="344" font-size="14" text-anchor="start">catches drift, daily</text>
<text x="40" y="434" font-size="15" font-weight="800" text-anchor="start">shared-bug review</text>
<rect x="380" y="410" width="500" height="36" rx="10" fill="#ffcfb8"/>
<text x="892" y="434" font-size="14" text-anchor="start">human review, per incident</text>
<line x1="380" y1="470" x2="1180" y2="470" stroke="#302828" stroke-width="2" marker-end="url(#arr)"/>
<text x="780" y="494" font-size="14" text-anchor="middle">more cost, but the last two rows buy judgment, not automation</text>
<text x="40" y="528" font-size="14" text-anchor="start">what no bar can buy:</text>
<g>
<rect x="40" y="540" width="560" height="56" rx="14" fill="#ffcfb8"/>
<text x="320" y="574" font-size="15" font-weight="800" text-anchor="middle">blind: incomplete input log</text>
<rect x="640" y="540" width="560" height="56" rx="14" fill="#ffcfb8"/>
<text x="920" y="574" font-size="15" font-weight="800" text-anchor="middle">blind: bug shared by both paths</text>
</g>
<text x="620" y="628" font-size="14" text-anchor="middle">a checker that replays garbage proves garbage; name the blind spots instead of hiding them</text>
</svg>
</div>
</body>
</html>
