<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retries share one ID; money moves once — DDIA Chapter 13 Solution 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&amp;family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Timeline of a transfer retried with the same request ID, moving money exactly once">
<title>Same-ID retry timeline with exactly-once money movement</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#302828"/>
</marker>
</defs>
<text x="620" y="52" font-size="30" font-weight="900" text-anchor="middle">Retries share one ID; money moves once</text>
<text x="620" y="86" font-size="16" text-anchor="middle">lost replies retry with the same key, the ledger dedups</text>
<text x="40" y="112" font-size="14" text-anchor="start">attempts over time:</text>
<g>
<rect x="40" y="122" width="200" height="92" rx="16" fill="#ffe08a"/>
<text x="140" y="160" font-size="16" font-weight="800" text-anchor="middle">submit req-7</text>
<text x="140" y="188" font-size="14" text-anchor="middle">A to B, 200</text>
</g>
<line x1="240" y1="168" x2="266" y2="168" stroke="#302828" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="270" y="122" width="200" height="92" rx="16" fill="#9278ef"/>
<text x="370" y="160" font-size="16" font-weight="800" text-anchor="middle">commit ok</text>
<text x="370" y="188" font-size="14" text-anchor="middle">request + moves + log</text>
</g>
<line x1="470" y1="168" x2="496" y2="168" stroke="#302828" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="500" y="122" width="200" height="92" rx="16" fill="#ffcfb8"/>
<text x="600" y="160" font-size="16" font-weight="800" text-anchor="middle">reply LOST</text>
<text x="600" y="188" font-size="14" text-anchor="middle">client must retry</text>
</g>
<line x1="700" y1="168" x2="726" y2="168" stroke="#302828" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="730" y="122" width="200" height="92" rx="16" fill="#c3ceff"/>
<text x="830" y="160" font-size="16" font-weight="800" text-anchor="middle">retry same id</text>
<text x="830" y="188" font-size="14" text-anchor="middle">same payload</text>
</g>
<line x1="930" y1="168" x2="956" y2="168" stroke="#302828" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="960" y="122" width="240" height="92" rx="16" fill="#bfe6c9"/>
<text x="1080" y="160" font-size="16" font-weight="800" text-anchor="middle">stored result</text>
<text x="1080" y="188" font-size="14" text-anchor="middle">no money moved</text>
</g>
<text x="40" y="262" font-size="14" text-anchor="start">balance A stays flat after the commit:</text>
<text x="40" y="330" font-size="16" font-weight="800" text-anchor="start">balance A:</text>
<g>
<rect x="200" y="292" width="150" height="72" rx="14" fill="#ffe08a"/>
<text x="275" y="336" font-size="18" font-weight="800" text-anchor="middle">1000</text>
</g>
<line x1="350" y1="328" x2="386" y2="328" stroke="#302828" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="390" y="292" width="190" height="72" rx="14" fill="#9278ef"/>
<text x="485" y="336" font-size="18" font-weight="800" text-anchor="middle">800 at commit</text>
</g>
<line x1="580" y1="328" x2="616" y2="328" stroke="#302828" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="620" y="292" width="210" height="72" rx="14" fill="#bfe6c9"/>
<text x="725" y="336" font-size="18" font-weight="800" text-anchor="middle">800 after retry</text>
</g>
<text x="860" y="336" font-size="14" text-anchor="start">flat line means exactly once</text>
<text x="40" y="412" font-size="14" text-anchor="start">the three ID rules:</text>
<g>
<rect x="40" y="424" width="360" height="110" rx="16" fill="#bfe6c9"/>
<text x="220" y="466" font-size="16" font-weight="800" text-anchor="middle">same id, same payload</text>
<text x="220" y="496" font-size="14" text-anchor="middle">stored result, dedup</text>
<rect x="440" y="424" width="360" height="110" rx="16" fill="#ffcfb8"/>
<text x="620" y="466" font-size="16" font-weight="800" text-anchor="middle">same id, NEW payload</text>
<text x="620" y="496" font-size="14" text-anchor="middle">REJECT, never apply</text>
<rect x="840" y="424" width="360" height="110" rx="16" fill="#c3ceff"/>
<text x="1020" y="466" font-size="16" font-weight="800" text-anchor="middle">NEW id, same payload</text>
<text x="1020" y="496" font-size="14" text-anchor="middle">independent transfer</text>
</g>
<text x="620" y="584" font-size="14" text-anchor="middle">legend: yellow = submit, purple = the one commit, peach = lost reply, blue = retry, green = safe outcome</text>
<text x="620" y="614" font-size="14" text-anchor="middle">at-least-once delivery plus an INSERT-first ledger gives exactly-once effect</text>
</svg>
</div>
</body>
</html>
