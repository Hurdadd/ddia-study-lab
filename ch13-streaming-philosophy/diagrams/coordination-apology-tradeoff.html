<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finding the Sweet Spot — Coordination vs Apologies</title>
<style>
  html,body{margin:0;background:#0b111c;color:#e8edf7;
    font-family:'Vazirmatn',system-ui,sans-serif;}
  .stage{width:100%; display:flex; justify-content:center; padding:10px 0;}
  svg{width:100%; height:auto; max-width:1240px;}
  .ttl{font:700 19px system-ui,sans-serif; fill:#5eead4}
  .sub{font:13px system-ui,sans-serif; fill:#a7b3cc}
  .cls-t{font:700 14px ui-monospace,Menlo,monospace; fill:#0b111c}
  .attr{font:12.5px ui-monospace,Menlo,monospace; fill:#cfe3ff}
  .obj-t{font:700 12.5px ui-monospace,Menlo,monospace; fill:#0b111c}
  .edge-lbl{font:700 12px ui-monospace,Menlo,monospace; fill:#86efac}
  .note{font:12.5px system-ui,sans-serif; fill:#cfe3ff}
  .note-h{font:700 13px system-ui,sans-serif; fill:#fbbf24}
  .card-lbl{font:700 11.5px ui-monospace,Menlo,monospace; fill:#86efac}
  .small{font:11.5px ui-monospace,Menlo,monospace; fill:#a7b3cc}
  .ax{font:700 13px system-ui,sans-serif; fill:#e8edf7}
  .ax-s{font:11.5px system-ui,sans-serif; fill:#a7b3cc}
  .ca{font:700 12px ui-monospace,Menlo,monospace; fill:#5eead4}
  .cb{font:700 12px ui-monospace,Menlo,monospace; fill:#fbbf24}
  .ct{font:700 12px ui-monospace,Menlo,monospace; fill:#f472b6}
  .dot-lbl{font:11.5px ui-monospace,Menlo,monospace; fill:#e8edf7}
  .spot{font:700 12.5px system-ui,sans-serif; fill:#f472b6}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1240 660" role="img" aria-label="Tradeoff chart of coordination versus apologies with U-shaped total and sweet spot">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#86efac"/>
    </marker>
  </defs>

  <text class="ttl" x="620" y="32" text-anchor="middle">Finding the Sweet Spot — Coordination vs Apologies</text>
  <text class="sub" x="620" y="54" text-anchor="middle">more coordination: fewer inconsistency apologies, more outage apologies — total has a minimum</text>

  <!-- legend -->
  <g>
    <line x1="150" y1="78" x2="182" y2="78" stroke="#5eead4" stroke-width="3"/>
    <text class="ca" x="188" y="82">A inconsistency</text>
    <line x1="330" y1="78" x2="362" y2="78" stroke="#fbbf24" stroke-width="3"/>
    <text class="cb" x="368" y="82">B outages</text>
    <line x1="480" y1="78" x2="512" y2="78" stroke="#f472b6" stroke-width="3" stroke-dasharray="7 5"/>
    <text class="ct" x="518" y="82">TOTAL (A + B)</text>
  </g>

  <!-- axes -->
  <line x1="140" y1="100" x2="140" y2="540" stroke="#e8edf7" stroke-width="1.6"/>
  <polygon points="140,92 134,104 146,104" fill="#e8edf7"/>
  <line x1="140" y1="540" x2="812" y2="540" stroke="#e8edf7" stroke-width="1.6"/>
  <polygon points="820,540 808,534 808,546" fill="#e8edf7"/>
  <text class="ax" x="60" y="120" text-anchor="middle">apologies</text>
  <text class="ax" x="60" y="138" text-anchor="middle">you must</text>
  <text class="ax" x="60" y="156" text-anchor="middle">make</text>
  <text class="ax-s" x="48" y="172" text-anchor="middle">(counts)</text>
  <text class="ax" x="480" y="600" text-anchor="middle">synchronous coordination</text>
  <text class="ax-s" x="170" y="560">none</text>
  <text class="ax-s" x="660" y="560">single leader / consensus / XA per op</text>

  <!-- grid -->
  <g stroke="#2a3652" stroke-width="1" stroke-dasharray="3 5" opacity="0.7">
    <line x1="140" y1="200" x2="810" y2="200"/>
    <line x1="140" y1="300" x2="810" y2="300"/>
    <line x1="140" y1="400" x2="810" y2="400"/>
    <line x1="140" y1="500" x2="810" y2="500"/>
  </g>

  <!-- curve A descending -->
  <path d="M160,175 C 320,210 480,360 790,455" fill="none" stroke="#5eead4" stroke-width="3"/>
  <!-- curve B ascending -->
  <path d="M160,485 C 320,470 520,300 790,175" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <!-- total U dashed -->
  <path d="M160,305 C 300,355 380,428 475,432 C 570,436 660,360 790,300" fill="none" stroke="#f472b6" stroke-width="2.6" stroke-dasharray="8 5"/>

  <!-- curve labels -->
  <text class="ca" x="163" y="132">A: apologies for INCONSISTENCY</text>
  <text class="small" x="163" y="148">constraint violations, lost updates</text>
  <text class="cb" x="800" y="128" text-anchor="end">B: apologies for OUTAGES</text>
  <text class="small" x="800" y="144" text-anchor="end">unavailability, stalls, spreading faults</text>
  <text class="ct" x="652" y="408">TOTAL apologies (A + B)</text>

  <!-- sweet spot -->
  <line x1="475" y1="432" x2="475" y2="540" stroke="#f472b6" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="475,418 468,430 472,432 478,432 482,430" fill="#f472b6"/>
  <circle cx="475" cy="432" r="6" fill="#f472b6" stroke="#0b111c" stroke-width="2"/>
  <text class="spot" x="490" y="462">sweet spot: neither too many</text>
  <text class="spot" x="490" y="478">inconsistencies nor outages</text>
  <text class="ax-s" x="475" y="560" text-anchor="middle">use sync coordination only where needed</text>
  <text class="ax-s" x="475" y="576" text-anchor="middle">small part of the app runs under it</text>

  <!-- example dots -->
  <circle cx="225" cy="272" r="6" fill="#5eead4" stroke="#0b111c" stroke-width="2"/>
  <text class="dot-lbl" x="225" y="232" text-anchor="middle">oversold warehouse</text>
  <text class="small" x="225" y="247" text-anchor="middle">apologize + discount</text>

  <circle cx="312" cy="308" r="6" fill="#5eead4" stroke="#0b111c" stroke-width="2"/>
  <text class="dot-lbl" x="312" y="330" text-anchor="middle">overbooked flight</text>
  <text class="small" x="312" y="345" text-anchor="middle">refund / upgrade</text>

  <circle cx="475" cy="382" r="6" fill="#e8edf7" stroke="#0b111c" stroke-width="2"/>
  <text class="dot-lbl" x="492" y="374">ATM overdraft</text>
  <text class="small" x="492" y="389">fees, daily limits bound risk</text>

  <circle cx="610" cy="342" r="6" fill="#a7b3cc" stroke="#0b111c" stroke-width="2"/>
  <text class="dot-lbl" x="627" y="322">cross-org settlement</text>
  <text class="small" x="627" y="337">corrections inevitable</text>

  <circle cx="730" cy="282" r="6" fill="#fbbf24" stroke="#0b111c" stroke-width="2"/>
  <text class="dot-lbl" x="730" y="222" text-anchor="middle">ATM cash payout</text>
  <text class="small" x="730" y="237" text-anchor="middle">cannot be recovered</text>

  <!-- side panel -->
  <rect x="852" y="100" width="348" height="140" rx="10" fill="#161d2e" stroke="#2a3652" stroke-width="1.4"/>
  <text class="note-h" x="868" y="124">Coordination cuts both ways</text>
  <text class="note" x="868" y="144">coordination reduces inconsistency</text>
  <text class="note" x="868" y="162">apologies BUT it reduces performance</text>
  <text class="note" x="868" y="180">and availability — raising outage</text>
  <text class="note" x="868" y="198">apologies (local faults escalate,</text>
  <text class="note" x="868" y="216">cross-region stalls).</text>

  <rect x="852" y="256" width="348" height="140" rx="10" fill="#161d2e" stroke="#2a3652" stroke-width="1.4"/>
  <text class="note-h" x="868" y="280">Cheap vs expensive apologies</text>
  <text class="note" x="868" y="300">LEFT: tolerate violations — cheap fix:</text>
  <text class="small" x="868" y="318">warehouse restock, flight refund,</text>
  <text class="small" x="868" y="334">overdraft fee.</text>
  <text class="note" x="868" y="354">RIGHT: coordinate — cash once paid</text>
  <text class="small" x="868" y="372">out of an ATM is gone.</text>

  <rect x="852" y="412" width="348" height="128" rx="10" fill="#1b2438" stroke="#f472b6" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="note-h" x="868" y="436">No zero-apology point</text>
  <text class="note" x="868" y="456">you cannot reach zero apologies —</text>
  <text class="note" x="868" y="474">find the best trade-off for your needs,</text>
  <text class="note" x="868" y="492">keep integrity, relax timeliness.</text>
  <text class="small" x="868" y="512">compensate later (compensating txn).</text>
</svg>
</div>
</body>
</html>
