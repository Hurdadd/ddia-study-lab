<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versions first, write-back before return — DDIA Chapter 10 Solution 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&amp;family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Replica versions before and after quorum write-back with read outcomes">
<title>Versions first, write-back before return</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#302828"/>
</marker>
</defs>
<text x="620" y="52" font-size="30" font-weight="900" text-anchor="middle">Versions first, write-back before return</text>
<text x="620" y="86" font-size="16" text-anchor="middle">ordered versions let any quorum find the newest, write-back makes it stick</text>
<text x="310" y="128" font-size="15" font-weight="800" text-anchor="middle">replica versions, t0 then t1</text>
<text x="930" y="128" font-size="15" font-weight="800" text-anchor="middle">what each quorum read returns</text>
<g>
<rect x="60" y="145" width="150" height="64" rx="14" fill="#bfe6c9"/>
<text x="135" y="172" font-size="15" font-weight="800" text-anchor="middle">n1: v2 new</text>
<text x="135" y="194" font-size="13" text-anchor="middle">only holder</text>
<rect x="235" y="145" width="150" height="64" rx="14" fill="#c3ceff"/>
<text x="310" y="172" font-size="15" font-weight="800" text-anchor="middle">n2: v1 old</text>
<text x="310" y="194" font-size="13" text-anchor="middle">not yet reached</text>
<rect x="410" y="145" width="150" height="64" rx="14" fill="#c3ceff"/>
<text x="485" y="172" font-size="15" font-weight="800" text-anchor="middle">n3: v1 old</text>
<text x="485" y="194" font-size="13" text-anchor="middle">not yet reached</text>
</g>
<line x1="310" y1="215" x2="310" y2="262" stroke="#302828" stroke-width="2" marker-end="url(#arr)"/>
<text x="470" y="248" font-size="14" text-anchor="middle">write-back v2 to quorum, before return</text>
<g>
<rect x="60" y="270" width="150" height="64" rx="14" fill="#bfe6c9"/>
<text x="135" y="297" font-size="15" font-weight="800" text-anchor="middle">n1: v2 new</text>
<text x="135" y="319" font-size="13" text-anchor="middle">unchanged</text>
<rect x="235" y="270" width="150" height="64" rx="14" fill="#bfe6c9"/>
<text x="310" y="297" font-size="15" font-weight="800" text-anchor="middle">n2: v2 new</text>
<text x="310" y="319" font-size="13" text-anchor="middle">written back</text>
<rect x="410" y="270" width="150" height="64" rx="14" fill="#c3ceff"/>
<text x="485" y="297" font-size="15" font-weight="800" text-anchor="middle">n3: v1 old</text>
<text x="485" y="319" font-size="13" text-anchor="middle">still lagging</text>
</g>
<g>
<rect x="640" y="145" width="560" height="60" rx="14" fill="#bfe6c9"/>
<text x="920" y="170" font-size="14" font-weight="800" text-anchor="middle">read1 {n1,n2}: max(v2,v1) = v2 new</text>
<text x="920" y="192" font-size="13" text-anchor="middle">concurrent with the write, allowed</text>
<rect x="640" y="213" width="560" height="60" rx="14" fill="#ffcfb8"/>
<text x="920" y="238" font-size="14" font-weight="800" text-anchor="middle">read2 {n2,n3}: max(v1,v1) = v1 STALE</text>
<text x="920" y="260" font-size="13" text-anchor="middle">starts after read1 returned: violation</text>
<rect x="640" y="281" width="560" height="60" rx="14" fill="#bfe6c9"/>
<text x="920" y="306" font-size="14" font-weight="800" text-anchor="middle">read2 again: max(v2,v1) = v2 new</text>
<text x="920" y="328" font-size="13" text-anchor="middle">after write-back: fixed</text>
</g>
<text x="310" y="372" font-size="14" text-anchor="middle">t0: partial write, never acknowledged as w=3</text>
<text x="920" y="372" font-size="14" text-anchor="middle">w + r &gt; n holds as arithmetic, freshness premise missing</text>
<g>
<rect x="40" y="396" width="1160" height="150" rx="16" fill="#ffe08a"/>
<text x="620" y="428" font-size="14" font-weight="800" text-anchor="middle">background read-repair runs after the read returns: too late for linearizability</text>
<text x="620" y="452" font-size="14" text-anchor="middle">ABD fix: the reader writes the max version back to a quorum BEFORE returning, so every later quorum meets it</text>
<text x="620" y="476" font-size="14" text-anchor="middle">versions are ordered (v1 &lt; v2): no leader needed to pick the newest</text>
<text x="620" y="500" font-size="14" text-anchor="middle">crashed reader after observing v2 but before write-back: the read is indeterminate, the next reader still repairs</text>
<text x="620" y="524" font-size="14" text-anchor="middle">multi-writer: add a query phase, read the highest timestamp before writing</text>
</g>
<text x="620" y="580" font-size="14" text-anchor="middle">legend: green = carries the newest version, blue = lagging, rose = the stale violation</text>
<text x="620" y="606" font-size="14" text-anchor="middle">membership is fixed here; changing members need overlapping old and new quorums</text>
</svg>
</div>
</body>
</html>
