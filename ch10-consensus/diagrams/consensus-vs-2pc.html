<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two rounds of voting: consensus vs 2PC</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f7f2e8;font-family:'Nunito','Vazirmatn',system-ui,sans-serif}
  .stage{max-width:1240px;margin:0 auto;padding:16px}
  svg{display:block;width:100%;height:auto}
  text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Comparing the two voting rounds of consensus with two-phase commit">
<title>Two rounds of voting: consensus vs 2PC</title>
<rect x="0" y="0" width="1240" height="660" rx="24" fill="#f7f2e8"/>
<text x="620" y="54" text-anchor="middle" font-size="22" font-weight="800">Two rounds of voting: consensus vs 2PC</text>

<rect x="40" y="110" width="560" height="330" rx="20" fill="#c3ceff"/>
<text x="320" y="170" text-anchor="middle" font-size="17" font-weight="800">Consensus</text>
<text x="320" y="214" text-anchor="middle" font-size="15">round 1: elect a leader</text>
<text x="320" y="248" text-anchor="middle" font-size="15">round 2: approve each entry</text>
<text x="320" y="304" text-anchor="middle" font-size="15">any node may start</text>
<text x="320" y="338" text-anchor="middle" font-size="15">a quorum reply is enough</text>
<text x="320" y="392" text-anchor="middle" font-size="15">one silent node is fine</text>

<rect x="640" y="110" width="560" height="330" rx="20" fill="#ffc2da"/>
<text x="920" y="170" text-anchor="middle" font-size="17" font-weight="800">2PC</text>
<text x="920" y="214" text-anchor="middle" font-size="15">round 1: prepare, vote</text>
<text x="920" y="248" text-anchor="middle" font-size="15">round 2: commit or abort</text>
<text x="920" y="304" text-anchor="middle" font-size="15">only the coordinator asks</text>
<text x="920" y="338" text-anchor="middle" font-size="15">EVERY voter must reply</text>
<text x="920" y="392" text-anchor="middle" font-size="15">one silence stalls everything</text>

<rect x="40" y="470" width="1160" height="140" rx="20" fill="#bfe6c9"/>
<text x="620" y="526" text-anchor="middle" font-size="17" font-weight="800">The verdict</text>
<text x="620" y="564" text-anchor="middle" font-size="15">the 2PC coordinator stays a single point of failure</text>
<text x="620" y="596" text-anchor="middle" font-size="15">unless hardened by consensus itself</text>
</svg>
</div>
</body>
</html>
