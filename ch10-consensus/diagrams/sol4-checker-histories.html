<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three histories, one rule — DDIA Chapter 10 Solution 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&amp;family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Three register histories with linearizability verdicts">
<title>Three histories, one rule</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#302828"/>
</marker>
</defs>
<text x="620" y="52" font-size="30" font-weight="900" text-anchor="middle">Three histories, one rule</text>
<text x="620" y="86" font-size="16" text-anchor="middle">precedence must hold and every read must see the latest preceding write</text>
<g font-size="13">
<text x="100" y="126" text-anchor="middle">t0</text>
<text x="260" y="126" text-anchor="middle">t1</text>
<text x="420" y="126" text-anchor="middle">t2</text>
<text x="580" y="126" text-anchor="middle">t3</text>
<text x="740" y="126" text-anchor="middle">t4</text>
<text x="900" y="126" text-anchor="middle">t5</text>
</g>
<line x1="100" y1="136" x2="900" y2="136" stroke="#302828" stroke-width="1"/>
<g>
<text x="60" y="180" font-size="15" font-weight="800" text-anchor="middle">h1</text>
<rect x="100" y="158" width="320" height="38" rx="10" fill="#9278ef"/>
<text x="260" y="183" font-size="14" text-anchor="middle">write(1), t0 to t2</text>
<rect x="580" y="158" width="160" height="38" rx="10" fill="#c3ceff"/>
<text x="660" y="183" font-size="14" text-anchor="middle">read to 1</text>
<rect x="960" y="152" width="220" height="50" rx="12" fill="#bfe6c9"/>
<text x="1070" y="183" font-size="15" font-weight="800" text-anchor="middle">LINEARIZABLE</text>
</g>
<g>
<text x="60" y="280" font-size="15" font-weight="800" text-anchor="middle">h2</text>
<rect x="100" y="258" width="320" height="38" rx="10" fill="#9278ef"/>
<text x="260" y="283" font-size="14" text-anchor="middle">write(1), t0 to t2</text>
<rect x="580" y="258" width="160" height="38" rx="10" fill="#ffcfb8"/>
<text x="660" y="283" font-size="14" text-anchor="middle">read to 0 STALE</text>
<rect x="960" y="252" width="220" height="50" rx="12" fill="#ffcfb8"/>
<text x="1070" y="276" font-size="15" font-weight="800" text-anchor="middle">NOT LINEARIZABLE</text>
<text x="1070" y="294" font-size="13" text-anchor="middle">stale after complete</text>
</g>
<line x1="420" y1="310" x2="576" y2="310" stroke="#302828" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/>
<text x="498" y="332" font-size="13" text-anchor="middle">write done before read starts: precedence forces order</text>
<g>
<text x="60" y="400" font-size="15" font-weight="800" text-anchor="middle">h3</text>
<rect x="100" y="378" width="480" height="38" rx="10" fill="#9278ef"/>
<text x="340" y="403" font-size="14" text-anchor="middle">write(1), t0 to t5</text>
<rect x="260" y="424" width="320" height="38" rx="10" fill="#c3ceff"/>
<text x="420" y="449" font-size="14" text-anchor="middle">read to 0, overlapping: allowed</text>
<rect x="960" y="392" width="220" height="50" rx="12" fill="#bfe6c9"/>
<text x="1070" y="423" font-size="15" font-weight="800" text-anchor="middle">LINEARIZABLE</text>
</g>
<g>
<rect x="40" y="492" width="1160" height="96" rx="16" fill="#ffe08a"/>
<text x="620" y="522" font-size="14" font-weight="800" text-anchor="middle">completed write then later stale read: reject that order, keep searching the rest</text>
<text x="620" y="546" font-size="14" text-anchor="middle">overlapping operations linearize either way: h3 may return 0 or 1</text>
<text x="620" y="570" font-size="14" text-anchor="middle">timed-out write is indeterminate: the checker tries took-effect and never-did branches</text>
</g>
<text x="620" y="618" font-size="14" text-anchor="middle">legend: violet = writes, blue = reads, green = accepted, rose = rejected</text>
<text x="620" y="642" font-size="14" text-anchor="middle">a passing sample never proves the next execution: pair with probes and monitors</text>
</svg>
</div>
</body>
</html>
