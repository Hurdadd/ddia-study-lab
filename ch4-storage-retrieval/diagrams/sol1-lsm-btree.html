<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSM vs B-tree write path + compaction — DDIA Chapter 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&amp;family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="LSM versus B-tree write paths with a compaction and amplification panel">
<title>LSM versus B-tree write paths</title>
<text x="620" y="52" font-size="27" font-weight="900" text-anchor="middle">LSM vs B-tree: where writes go</text>
<text x="620" y="82" font-size="15" text-anchor="middle">teaching sketch, not a benchmark</text>
<g>
<rect x="30" y="105" width="740" height="225" rx="20" fill="#cfe3ff"/>
<text x="400" y="140" font-size="19" font-weight="800" text-anchor="middle">LSM write path: always append</text>
<rect x="55" y="160" width="155" height="95" rx="14" fill="#f7f2e8"/>
<text x="132" y="195" font-size="17" font-weight="800" text-anchor="middle">WAL</text>
<text x="132" y="222" font-size="14" text-anchor="middle">append + fsync</text>
<rect x="235" y="160" width="155" height="95" rx="14" fill="#f7f2e8"/>
<text x="312" y="195" font-size="17" font-weight="800" text-anchor="middle">Memtable</text>
<text x="312" y="222" font-size="14" text-anchor="middle">sorted RAM</text>
<rect x="415" y="160" width="155" height="95" rx="14" fill="#f7f2e8"/>
<text x="492" y="195" font-size="17" font-weight="800" text-anchor="middle">SSTables</text>
<text x="492" y="222" font-size="14" text-anchor="middle">immutable</text>
<rect x="595" y="160" width="150" height="95" rx="14" fill="#f7f2e8"/>
<text x="670" y="195" font-size="17" font-weight="800" text-anchor="middle">Compact</text>
<text x="670" y="222" font-size="14" text-anchor="middle">merge + tomb</text>
<text x="222" y="212" font-size="16" text-anchor="middle">-&gt;</text>
<text x="402" y="212" font-size="16" text-anchor="middle">-&gt;</text>
<text x="582" y="212" font-size="16" text-anchor="middle">-&gt;</text>
<text x="400" y="292" font-size="14" text-anchor="middle">point read: mem first, then newest to oldest segment</text>
</g>
<g>
<rect x="790" y="105" width="420" height="225" rx="20" fill="#ffe08a"/>
<text x="1000" y="140" font-size="19" font-weight="800" text-anchor="middle">B-tree: rewrite page in place</text>
<rect x="812" y="160" width="120" height="95" rx="14" fill="#f7f2e8"/>
<text x="872" y="195" font-size="16" font-weight="800" text-anchor="middle">Find leaf</text>
<text x="872" y="222" font-size="14" text-anchor="middle">root to leaf</text>
<rect x="948" y="160" width="120" height="95" rx="14" fill="#f7f2e8"/>
<text x="1008" y="195" font-size="16" font-weight="800" text-anchor="middle">Rewrite</text>
<text x="1008" y="222" font-size="14" text-anchor="middle">same page</text>
<rect x="1084" y="160" width="104" height="95" rx="14" fill="#f7f2e8"/>
<text x="1136" y="195" font-size="16" font-weight="800" text-anchor="middle">WAL</text>
<text x="1136" y="222" font-size="14" text-anchor="middle">fsync</text>
<text x="1000" y="292" font-size="14" text-anchor="middle">range scan follows the leaf chain</text>
</g>
<g>
<rect x="30" y="350" width="1180" height="280" rx="20" fill="#e9e2d2"/>
<text x="620" y="388" font-size="19" font-weight="800" text-anchor="middle">Amplification per user write (teaching ratios)</text>
<text x="270" y="425" font-size="16" font-weight="800" text-anchor="middle">write amp</text>
<text x="620" y="425" font-size="16" font-weight="800" text-anchor="middle">read amp</text>
<text x="970" y="425" font-size="16" font-weight="800" text-anchor="middle">space amp</text>
<text x="270" y="462" font-size="14" text-anchor="middle">LSM: rewrite on compact ~10x</text>
<text x="620" y="462" font-size="14" text-anchor="middle">LSM: check several segments</text>
<text x="970" y="462" font-size="14" text-anchor="middle">LSM: old + new until merge</text>
<text x="270" y="502" font-size="14" text-anchor="middle">B-tree: page rewrite ~1-2x</text>
<text x="620" y="502" font-size="14" text-anchor="middle">B-tree: depth 3-4 pages</text>
<text x="970" y="502" font-size="14" text-anchor="middle">B-tree: pages + WAL + splits</text>
<text x="620" y="556" font-size="14" text-anchor="middle">crash between flush and manifest: SSTable file ignored, WAL replayed</text>
<text x="620" y="592" font-size="14" text-anchor="middle">tombstone dropped too early resurrects the old value</text>
</g>
</svg>
</div>
</body>
</html>
