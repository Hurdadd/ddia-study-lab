<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online vs batch: two worlds</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f7f2e8;font-family:'Nunito','Vazirmatn',system-ui,sans-serif}
  .stage{max-width:1240px;margin:0 auto;padding:16px}
  svg{display:block;width:100%;height:auto}
  text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Online versus batch processing, and the three gifts of the batch contract">
<title>Online vs batch: two worlds</title>
<rect x="0" y="0" width="1240" height="660" rx="24" fill="#f7f2e8"/>
<text x="620" y="54" text-anchor="middle" font-size="22" font-weight="800">Online vs batch: two worlds</text>

<rect x="40" y="110" width="560" height="320" rx="20" fill="#c3ceff"/>
<text x="320" y="170" text-anchor="middle" font-size="17" font-weight="800">Online</text>
<text x="320" y="214" text-anchor="middle" font-size="15">ask, answer fast</text>
<text x="320" y="248" text-anchor="middle" font-size="15">metric: response time</text>
<text x="320" y="304" text-anchor="middle" font-size="15">runs for milliseconds</text>
<text x="320" y="338" text-anchor="middle" font-size="15">must stay available</text>
<text x="320" y="392" text-anchor="middle" font-size="15">mutates live data</text>

<rect x="640" y="110" width="560" height="320" rx="20" fill="#d3c3f2"/>
<text x="920" y="170" text-anchor="middle" font-size="17" font-weight="800">Batch</text>
<text x="920" y="214" text-anchor="middle" font-size="15">immutable in, derived out</text>
<text x="920" y="248" text-anchor="middle" font-size="15">metric: throughput</text>
<text x="920" y="304" text-anchor="middle" font-size="15">runs for hours or days</text>
<text x="920" y="338" text-anchor="middle" font-size="15">rebuilds output from scratch</text>
<text x="920" y="392" text-anchor="middle" font-size="15">never mutates input</text>

<rect x="40" y="460" width="1160" height="150" rx="20" fill="#bfe6c9"/>
<text x="620" y="516" text-anchor="middle" font-size="17" font-weight="800">One contract, three gifts</text>
<text x="620" y="554" text-anchor="middle" font-size="15">time travel to older outputs</text>
<text x="620" y="586" text-anchor="middle" font-size="15">human fault tolerance plus safe task retries</text>
</svg>
</div>
</body>
</html>
