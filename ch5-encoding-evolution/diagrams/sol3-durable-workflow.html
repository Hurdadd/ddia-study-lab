<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Durable order workflow state machine — DDIA Chapter 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&amp;family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Durable workflow state machine: reserve, charge and ship steps with retry, version gate and compensation">
<title>Durable order workflow: steps, retry, compensation</title>
<text x="620" y="58" font-size="30" font-weight="900" text-anchor="middle">Durable order workflow: steps, retry, compensation</text>
<text x="620" y="94" font-size="16" text-anchor="middle">every step has a stable id · results live in the durable log · replay never re-runs a logged step</text>
<text x="40" y="180" font-size="14">main</text>
<g>
<rect x="115" y="130" width="190" height="90" rx="14" fill="#f7f2e8" stroke="#302828" stroke-width="2"/>
<text x="210" y="168" font-size="17" font-weight="800" text-anchor="middle">Start</text>
<text x="210" y="193" font-size="14" text-anchor="middle">trigger</text>
<rect x="320" y="130" width="190" height="90" rx="14" fill="#f7f2e8" stroke="#302828" stroke-width="2"/>
<text x="415" y="168" font-size="17" font-weight="800" text-anchor="middle">Reserve stock</text>
<text x="415" y="193" font-size="14" text-anchor="middle">step id R</text>
<rect x="525" y="130" width="190" height="90" rx="14" fill="#f7f2e8" stroke="#302828" stroke-width="2"/>
<text x="620" y="168" font-size="17" font-weight="800" text-anchor="middle">Charge card</text>
<text x="620" y="193" font-size="14" text-anchor="middle">step id C</text>
<rect x="730" y="130" width="190" height="90" rx="14" fill="#f7f2e8" stroke="#302828" stroke-width="2"/>
<text x="825" y="168" font-size="17" font-weight="800" text-anchor="middle">Ship order</text>
<text x="825" y="193" font-size="14" text-anchor="middle">step id S</text>
<rect x="935" y="130" width="190" height="90" rx="14" fill="#bfe6c9"/>
<text x="1030" y="168" font-size="17" font-weight="800" text-anchor="middle">Done</text>
<text x="1030" y="193" font-size="14" text-anchor="middle">all logged</text>
<text x="312" y="182" font-size="15" text-anchor="middle">--&gt;</text>
<text x="517" y="182" font-size="15" text-anchor="middle">--&gt;</text>
<text x="722" y="182" font-size="15" text-anchor="middle">--&gt;</text>
<text x="927" y="182" font-size="15" text-anchor="middle">--&gt;</text>
<text x="312" y="242" font-size="13" text-anchor="middle">guard: valid</text>
<text x="517" y="242" font-size="13" text-anchor="middle">guard: stock ok</text>
<text x="722" y="242" font-size="13" text-anchor="middle">guard: charged</text>
<text x="927" y="242" font-size="13" text-anchor="middle">guard: shipped</text>
</g>
<rect x="320" y="255" width="600" height="44" rx="22" fill="#c3ceff"/>
<text x="620" y="283" font-size="14" text-anchor="middle">retry: same step id, replay reuses logged results</text>
<text x="40" y="405" font-size="14">terminal</text>
<g>
<rect x="320" y="350" width="190" height="100" rx="14" fill="#f7f2e8" stroke="#302828" stroke-width="2" stroke-dasharray="8 5"/>
<text x="415" y="390" font-size="17" font-weight="800" text-anchor="middle">Version gate</text>
<text x="415" y="417" font-size="14" text-anchor="middle">v1 history: v1 code</text>
<rect x="730" y="350" width="190" height="100" rx="14" fill="#ffcfb8"/>
<text x="825" y="390" font-size="17" font-weight="800" text-anchor="middle">Compensate</text>
<text x="825" y="417" font-size="14" text-anchor="middle">undo charge, release</text>
<rect x="935" y="350" width="190" height="100" rx="14" fill="#b3402e"/>
<text x="1030" y="390" font-size="17" font-weight="800" text-anchor="middle" fill="#f7f2e8">Compensated</text>
<text x="1030" y="417" font-size="14" text-anchor="middle" fill="#f7f2e8">terminal</text>
<line x1="825" y1="220" x2="825" y2="345" stroke="#302828" stroke-width="2"/>
<text x="825" y="342" font-size="15" text-anchor="middle">v</text>
<text x="862" y="290" font-size="14">fails after charge</text>
<text x="927" y="405" font-size="15" text-anchor="middle">--&gt;</text>
<line x1="415" y1="350" x2="415" y2="225" stroke="#302828" stroke-width="2" stroke-dasharray="8 5"/>
<text x="427" y="330" font-size="14">replay</text>
</g>
<text x="620" y="520" font-size="15" text-anchor="middle">order, branch or payload changes ship as a NEW version — in-flight runs finish on the old one</text>
<text x="620" y="560" font-size="15" text-anchor="middle">no idempotency key at the provider means at-most-once effects need reconciliation, not retries</text>
</svg>
</div>
</body>
</html>
