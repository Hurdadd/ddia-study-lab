<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avro vs Protobuf evolution matrix — DDIA Chapter 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&amp;family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Compatibility matrix: Avro versus Protobuf for add, rename and cardinality changes">
<title>Schema-evolution compatibility matrix</title>
<text x="620" y="58" font-size="30" font-weight="900" text-anchor="middle">Add, rename, cardinality: who survives?</text>
<text x="620" y="94" font-size="16" text-anchor="middle">B = new reader reads old data · F = old reader reads new data · binary path unless noted</text>
<rect x="330" y="120" width="420" height="56" rx="14" fill="#c3ceff"/>
<text x="540" y="155" font-size="20" font-weight="800" text-anchor="middle">Protobuf (tags)</text>
<rect x="790" y="120" width="420" height="56" rx="14" fill="#ffe08a"/>
<text x="1000" y="155" font-size="20" font-weight="800" text-anchor="middle">Avro (names)</text>
<g>
<rect x="30" y="200" width="260" height="110" rx="14" fill="#f7f2e8" stroke="#302828" stroke-width="2"/>
<text x="160" y="250" font-size="18" font-weight="800" text-anchor="middle">add optional field</text>
<text x="160" y="278" font-size="14" text-anchor="middle">fresh tag / default</text>
<rect x="330" y="200" width="420" height="110" rx="14" fill="#bfe6c9"/>
<text x="540" y="250" font-size="18" font-weight="800" text-anchor="middle">B yes · F yes</text>
<text x="540" y="278" font-size="14" text-anchor="middle">skip + preserve / default</text>
<rect x="790" y="200" width="420" height="110" rx="14" fill="#bfe6c9"/>
<text x="1000" y="250" font-size="18" font-weight="800" text-anchor="middle">B yes · F yes</text>
<text x="1000" y="278" font-size="14" text-anchor="middle">default fills / ignore extra</text>
</g>
<g>
<rect x="30" y="330" width="260" height="110" rx="14" fill="#f7f2e8" stroke="#302828" stroke-width="2"/>
<text x="160" y="380" font-size="18" font-weight="800" text-anchor="middle">rename field</text>
<text x="160" y="408" font-size="14" text-anchor="middle">same tag / alias</text>
<rect x="330" y="330" width="420" height="110" rx="14" fill="#bfe6c9"/>
<text x="540" y="380" font-size="18" font-weight="800" text-anchor="middle">B yes · F yes</text>
<text x="540" y="408" font-size="14" text-anchor="middle">names absent on wire</text>
<rect x="790" y="330" width="420" height="110" rx="14" fill="#ffe08a"/>
<text x="1000" y="380" font-size="18" font-weight="800" text-anchor="middle">B yes · F no</text>
<text x="1000" y="408" font-size="14" text-anchor="middle">alias reads old, not new</text>
</g>
<g>
<rect x="30" y="460" width="260" height="110" rx="14" fill="#f7f2e8" stroke="#302828" stroke-width="2"/>
<text x="160" y="508" font-size="18" font-weight="800" text-anchor="middle">one to many</text>
<text x="160" y="536" font-size="14" text-anchor="middle">new field + dual write</text>
<rect x="330" y="460" width="420" height="110" rx="14" fill="#ffcfb8"/>
<text x="540" y="508" font-size="18" font-weight="800" text-anchor="middle">risky in place</text>
<text x="540" y="536" font-size="14" text-anchor="middle">type + packing dependent</text>
<rect x="790" y="460" width="420" height="110" rx="14" fill="#ffcfb8"/>
<text x="1000" y="508" font-size="18" font-weight="800" text-anchor="middle">not compatible</text>
<text x="1000" y="536" font-size="14" text-anchor="middle">resolution has no such rule</text>
</g>
<text x="620" y="618" font-size="15" text-anchor="middle">parseable is not lossless: migrate cardinality via a NEW field, never by retyping</text>
</svg>
</div>
</body>
</html>
