<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unknown fields: binary round-trip vs JSON copy — DDIA Chapter 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&amp;family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Two paths for unknown fields: binary round-trip keeps tag 4, JSON conversion drops it">
<title>Unknown-field preservation: two paths</title>
<text x="620" y="58" font-size="30" font-weight="900" text-anchor="middle">Unknown fields: two paths, two fates</text>
<text x="620" y="94" font-size="16" text-anchor="middle">new code adds tag 4 (email) — old code reads, rewrites, new code reads again</text>
<g>
<rect x="30" y="130" width="1180" height="200" rx="20" fill="#bfe6c9"/>
<text x="60" y="168" font-size="18" font-weight="800">PATH A — binary round-trip</text>
<text x="60" y="194" font-size="14">proper runtime stores unknown bytes</text>
<rect x="60" y="210" width="180" height="80" rx="14" fill="#f7f2e8"/>
<text x="150" y="243" font-size="16" font-weight="800" text-anchor="middle">new writer</text>
<text x="150" y="268" font-size="14" text-anchor="middle">tags 1-4</text>
<rect x="300" y="210" width="180" height="80" rx="14" fill="#f7f2e8"/>
<text x="390" y="243" font-size="16" font-weight="800" text-anchor="middle">old reader</text>
<text x="390" y="268" font-size="14" text-anchor="middle">knows 1-3</text>
<rect x="540" y="210" width="180" height="80" rx="14" fill="#f7f2e8"/>
<text x="630" y="243" font-size="16" font-weight="800" text-anchor="middle">write back</text>
<text x="630" y="268" font-size="14" text-anchor="middle">bytes untouched</text>
<rect x="780" y="210" width="180" height="80" rx="14" fill="#f7f2e8"/>
<text x="870" y="243" font-size="16" font-weight="800" text-anchor="middle">new reader</text>
<text x="870" y="268" font-size="14" text-anchor="middle">tag 4 intact</text>
<rect x="1010" y="210" width="170" height="80" rx="14" fill="#2e7d4f"/>
<text x="1095" y="243" font-size="18" font-weight="800" text-anchor="middle" fill="#f7f2e8">KEPT</text>
<text x="1095" y="268" font-size="14" text-anchor="middle" fill="#f7f2e8">no loss</text>
<text x="270" y="258" font-size="16" text-anchor="middle">--&gt;</text>
<text x="510" y="258" font-size="16" text-anchor="middle">--&gt;</text>
<text x="750" y="258" font-size="16" text-anchor="middle">--&gt;</text>
<text x="985" y="258" font-size="16" text-anchor="middle">--&gt;</text>
</g>
<g>
<rect x="30" y="360" width="1180" height="200" rx="20" fill="#ffcfb8"/>
<text x="60" y="398" font-size="18" font-weight="800">PATH B — JSON convert or field-by-field copy</text>
<text x="60" y="424" font-size="14">unknown bytes have nowhere to live</text>
<rect x="60" y="440" width="180" height="80" rx="14" fill="#f7f2e8"/>
<text x="150" y="473" font-size="16" font-weight="800" text-anchor="middle">new writer</text>
<text x="150" y="498" font-size="14" text-anchor="middle">tags 1-4</text>
<rect x="300" y="440" width="180" height="80" rx="14" fill="#f7f2e8"/>
<text x="390" y="473" font-size="16" font-weight="800" text-anchor="middle">old proxy</text>
<text x="390" y="498" font-size="14" text-anchor="middle">copies 1-3</text>
<rect x="540" y="440" width="180" height="80" rx="14" fill="#f7f2e8"/>
<text x="630" y="473" font-size="16" font-weight="800" text-anchor="middle">fresh record</text>
<text x="630" y="498" font-size="14" text-anchor="middle">tag 4 missing</text>
<rect x="780" y="440" width="180" height="80" rx="14" fill="#f7f2e8"/>
<text x="870" y="473" font-size="16" font-weight="800" text-anchor="middle">new reader</text>
<text x="870" y="498" font-size="14" text-anchor="middle">email gone</text>
<rect x="1010" y="440" width="170" height="80" rx="14" fill="#b3402e"/>
<text x="1095" y="473" font-size="18" font-weight="800" text-anchor="middle" fill="#f7f2e8">LOST</text>
<text x="1095" y="498" font-size="14" text-anchor="middle" fill="#f7f2e8">silent drop</text>
<text x="270" y="488" font-size="16" text-anchor="middle">--&gt;</text>
<text x="510" y="488" font-size="16" text-anchor="middle">--&gt;</text>
<text x="750" y="488" font-size="16" text-anchor="middle">--&gt;</text>
<text x="985" y="488" font-size="16" text-anchor="middle">--&gt;</text>
</g>
<text x="620" y="610" font-size="15" text-anchor="middle">wire-compatible is not meaning-preserving: test the runtime AND the conversion path</text>
</svg>
</div>
</body>
</html>
