<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept: backward vs forward compatibility matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f7f2e8;display:flex;justify-content:center;padding:24px;font-family:'Nunito','Vazirmatn',system-ui,sans-serif}
  .stage{width:100%;max-width:1240px;background:#f7f2e8}
  svg{display:block;width:100%;height:auto;background:#f7f2e8}
  text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Two by two matrix of old and new data versus old and new code, naming backward and forward compatibility">
<title>Backward vs forward: who reads what?</title>
<text x="620" y="42" text-anchor="middle" font-size="20" font-weight="800">Backward vs forward: who reads what?</text>
<rect x="395" y="66" width="330" height="62" rx="16" fill="#c3ceff" stroke="#302828" stroke-width="2.5"/>
<text x="560" y="105" text-anchor="middle" font-size="15" font-weight="800">Old code reads</text>
<rect x="785" y="66" width="330" height="62" rx="16" fill="#c3ceff" stroke="#302828" stroke-width="2.5"/>
<text x="950" y="105" text-anchor="middle" font-size="15" font-weight="800">New code reads</text>
<rect x="65" y="160" width="300" height="130" rx="18" fill="#fffdf7" stroke="#302828" stroke-width="2.5"/>
<text x="215" y="208" text-anchor="middle" font-size="16" font-weight="800">Old data</text>
<text x="215" y="236" text-anchor="middle" font-size="13">written by old code</text>
<rect x="65" y="350" width="300" height="130" rx="18" fill="#fffdf7" stroke="#302828" stroke-width="2.5"/>
<text x="215" y="398" text-anchor="middle" font-size="16" font-weight="800">New data</text>
<text x="215" y="426" text-anchor="middle" font-size="13">written by new code</text>
<rect x="395" y="160" width="330" height="130" rx="18" fill="#bfe6c9" stroke="#302828" stroke-width="2.5"/>
<text x="560" y="208" text-anchor="middle" font-size="16" font-weight="800">Same version</text>
<text x="560" y="236" text-anchor="middle" font-size="13">nothing new to read</text>
<rect x="785" y="160" width="330" height="130" rx="18" fill="#c3ceff" stroke="#302828" stroke-width="2.5"/>
<text x="950" y="208" text-anchor="middle" font-size="16" font-weight="800">BACKWARD compatible</text>
<text x="950" y="236" text-anchor="middle" font-size="13">new code reads old data</text>
<rect x="395" y="350" width="330" height="130" rx="18" fill="#ffe08a" stroke="#302828" stroke-width="2.5"/>
<text x="560" y="398" text-anchor="middle" font-size="16" font-weight="800">FORWARD compatible</text>
<text x="560" y="426" text-anchor="middle" font-size="13">old code reads new data</text>
<rect x="785" y="350" width="330" height="130" rx="18" fill="#bfe6c9" stroke="#302828" stroke-width="2.5"/>
<text x="950" y="398" text-anchor="middle" font-size="16" font-weight="800">Same version</text>
<text x="950" y="426" text-anchor="middle" font-size="13">nothing new to read</text>
<rect x="65" y="520" width="1050" height="80" rx="18" fill="#d3c3f2" stroke="#302828" stroke-width="2.5"/>
<text x="590" y="568" text-anchor="middle" font-size="16" font-weight="800">Rolling upgrade mixes versions: you need BOTH</text>
</svg>
</div>
</body>
</html>
