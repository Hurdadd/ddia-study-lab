<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shredding vs embedding — DDIA Chapter 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&amp;family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Shredding versus embedding a resume">
<title>Resume: shredding versus embedding</title>
<text x="620" y="55" font-size="28" font-weight="900" text-anchor="middle">Resume: shredding vs embedding</text>
<g>
<rect x="70" y="110" width="540" height="430" rx="20" fill="#c3ceff"/>
<text x="340" y="162" font-size="21" font-weight="800" text-anchor="middle">Shredding: tables + JOIN</text>
<rect x="140" y="196" width="400" height="48" rx="12" fill="#f7f2e8"/>
<text x="340" y="227" font-size="16" text-anchor="middle">users: PK user_id</text>
<rect x="140" y="260" width="400" height="48" rx="12" fill="#f7f2e8"/>
<text x="340" y="291" font-size="16" text-anchor="middle">positions: FK user_id</text>
<rect x="140" y="324" width="400" height="48" rx="12" fill="#f7f2e8"/>
<text x="340" y="355" font-size="16" text-anchor="middle">education: FK user_id</text>
<text x="340" y="432" font-size="15" text-anchor="middle">read: JOIN on every read</text>
<text x="340" y="462" font-size="15" text-anchor="middle">write: one row at a time</text>
</g>
<g>
<rect x="630" y="110" width="540" height="430" rx="20" fill="#bfe6c9"/>
<text x="900" y="162" font-size="21" font-weight="800" text-anchor="middle">Embedding: one JSON doc</text>
<rect x="700" y="196" width="400" height="176" rx="12" fill="#f7f2e8"/>
<text x="730" y="232" font-size="15">{ _id: 251, name: ... }</text>
<text x="730" y="266" font-size="15">jobs: [ {...}, {...} ]</text>
<text x="730" y="300" font-size="15">education: [ {...} ]</text>
<text x="730" y="334" font-size="15">}  // a single read</text>
<text x="900" y="432" font-size="15" text-anchor="middle">read: one lookup</text>
<text x="900" y="462" font-size="15" text-anchor="middle">write: rewrite + copies</text>
</g>
<text x="620" y="602" font-size="16" text-anchor="middle">one-to-few tree? embed it. many-to-many web? reference it.</text>
</svg>
</div>
</body>
</html>
