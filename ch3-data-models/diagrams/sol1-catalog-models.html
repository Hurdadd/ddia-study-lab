<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog models: relational vs document — DDIA Chapter 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&amp;family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Relational versus document catalog">
<title>Relational versus document catalog</title>
<text x="620" y="52" font-size="28" font-weight="900" text-anchor="middle">Catalog: relational tables vs one document</text>
<text x="620" y="84" font-size="15" text-anchor="middle">bounded data embeds, unbounded data references</text>
<g>
<rect x="40" y="110" width="560" height="400" rx="20" fill="#c3ceff"/>
<text x="320" y="148" font-size="20" font-weight="800" text-anchor="middle">A - Relational: entities + keys</text>
<rect x="60" y="168" width="250" height="118" rx="12" fill="#f7f2e8"/>
<text x="185" y="194" font-size="16" font-weight="800" text-anchor="middle">brands</text>
<text x="185" y="220" font-size="13" text-anchor="middle">id PK</text>
<text x="185" y="242" font-size="13" text-anchor="middle">name UNIQUE</text>
<text x="185" y="264" font-size="13" text-anchor="middle">logo_url, logo_v</text>
<rect x="330" y="168" width="250" height="118" rx="12" fill="#f7f2e8"/>
<text x="455" y="194" font-size="16" font-weight="800" text-anchor="middle">products</text>
<text x="455" y="220" font-size="13" text-anchor="middle">id PK</text>
<text x="455" y="242" font-size="13" text-anchor="middle">brand_id FK</text>
<text x="455" y="264" font-size="13" text-anchor="middle">name, price</text>
<line x1="330" y1="227" x2="310" y2="227" stroke="#302828" stroke-width="2"/>
<text x="320" y="212" font-size="13" text-anchor="middle">N..1</text>
<rect x="60" y="300" width="250" height="118" rx="12" fill="#f7f2e8"/>
<text x="185" y="326" font-size="16" font-weight="800" text-anchor="middle">prod_categories</text>
<text x="185" y="352" font-size="13" text-anchor="middle">product_id FK</text>
<text x="185" y="374" font-size="13" text-anchor="middle">category_id FK</text>
<text x="185" y="396" font-size="13" text-anchor="middle">many-to-many</text>
<rect x="330" y="300" width="250" height="118" rx="12" fill="#f7f2e8"/>
<text x="455" y="326" font-size="16" font-weight="800" text-anchor="middle">reviews</text>
<text x="455" y="352" font-size="13" text-anchor="middle">product_id FK</text>
<text x="455" y="374" font-size="13" text-anchor="middle">UNIQUE(prod, user)</text>
<text x="455" y="396" font-size="13" text-anchor="middle">idx (prod, id)</text>
<text x="320" y="452" font-size="14" text-anchor="middle">brand change: 1 atomic row</text>
<text x="320" y="478" font-size="14" text-anchor="middle">reviews: keyset on (prod, id)</text>
</g>
<g>
<rect x="640" y="110" width="560" height="400" rx="20" fill="#ffe08a"/>
<text x="920" y="148" font-size="20" font-weight="800" text-anchor="middle">B - Document: one nested tree</text>
<rect x="670" y="168" width="500" height="150" rx="12" fill="#f7f2e8"/>
<text x="920" y="196" font-size="16" font-weight="800" text-anchor="middle">product doc (JSON)</text>
<text x="920" y="224" font-size="13" text-anchor="middle">brand_thumb: embedded (tiny)</text>
<text x="920" y="248" font-size="13" text-anchor="middle">categories: [..] embedded</text>
<text x="920" y="272" font-size="13" text-anchor="middle">reviews: NOT here - see below</text>
<text x="920" y="296" font-size="13" text-anchor="middle">one read, O(n) rewrite risk</text>
<rect x="670" y="332" width="500" height="118" rx="12" fill="#f7f2e8"/>
<text x="920" y="360" font-size="16" font-weight="800" text-anchor="middle">reviews collection</text>
<text x="920" y="388" font-size="13" text-anchor="middle">reference + second query</text>
<text x="920" y="412" font-size="13" text-anchor="middle">keyset cursor (stars, id)</text>
<line x1="920" y1="318" x2="920" y2="332" stroke="#302828" stroke-width="2" stroke-dasharray="6 5"/>
<text x="920" y="478" font-size="14" text-anchor="middle">million-review array breaks the doc</text>
</g>
<rect x="40" y="528" width="1160" height="92" rx="16" fill="#bfe6c9"/>
<text x="620" y="564" font-size="15" font-weight="800" text-anchor="middle">bounded + tiny: embed - unbounded: reference</text>
<text x="620" y="592" font-size="15" text-anchor="middle">pagination by keyset, uniqueness by constraint, brand rename = 1 row</text>
</svg>
</div>
</body>
</html>
