<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layered data — DDIA Chapter 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&amp;family=Vazirmatn:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f2e8;display:flex;justify-content:center}
.stage{width:100%;max-width:1280px;padding:16px}
svg{width:100%;height:auto;display:block;background:#f7f2e8;border-radius:24px}
svg text{font-family:'Nunito','Vazirmatn',system-ui,sans-serif;fill:#302828}
</style>
</head>
<body>
<div class="stage">
<svg width="100%" viewBox="0 0 1240 660" role="img" aria-label="Four layers of data models">
<title>Data is layered: four models stacked</title>
<text x="620" y="58" font-size="28" font-weight="900" text-anchor="middle">Data is layered: four models stacked</text>
<g>
<rect x="120" y="130" width="940" height="88" rx="16" fill="#ffe08a"/>
<text x="160" y="186" font-size="20" font-weight="800">L1 App objects</text>
<text x="490" y="186" font-size="16">people, orders, sensors, as code</text>
</g>
<g>
<rect x="120" y="242" width="940" height="88" rx="16" fill="#bfe6c9"/>
<text x="160" y="298" font-size="20" font-weight="800">L2 Storage model</text>
<text x="490" y="298" font-size="16">JSON, tables, or graph: this chapter</text>
</g>
<g>
<rect x="120" y="354" width="940" height="88" rx="16" fill="#c3ceff"/>
<text x="160" y="410" font-size="20" font-weight="800">L3 Storage engine</text>
<text x="490" y="410" font-size="16">bytes on disk and memory (chapter 4)</text>
</g>
<g>
<rect x="120" y="466" width="940" height="88" rx="16" fill="#d3c3f2"/>
<text x="160" y="522" font-size="20" font-weight="800">L4 Hardware</text>
<text x="490" y="522" font-size="16">currents, light, magnetism</text>
</g>
<text x="1200" y="226" font-size="13" text-anchor="end">abstracts</text>
<text x="1200" y="338" font-size="13" text-anchor="end">encodes</text>
<text x="1200" y="450" font-size="13" text-anchor="end">embodies</text>
<text x="620" y="612" font-size="15" text-anchor="middle">each layer hides the one below, so many teams can collaborate</text>
</svg>
</div>
</body>
</html>
